<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rogier's Bakboek">
<meta name="application-name" content="Rogier's Bakboek">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1a0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Rogier's Bakboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: hero met wisselend baksel, tabs eronder, smalle kolom papieren kaarten. Accentkleur wisselt per recept. */
:root{
  --bg:#f5f0e8; --paper:#f2ead8; --paper-edge:#e6dcc8;
  --ink:#1e1a15; --muted:#6e655b;
  --green:#4a7a5a; --green-pale:#d0e4d8;
  --a-pizza:#b03a30; --a-bol:#b8732c; --a-zd:#7a5230;
  --a-pale:#f1dfc6;
  --warn-bg:#f6e3d6; --warn-fg:#8a3a1c;
  --hero-ink:#fdf8ef;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Jost','Helvetica Neue',Arial,sans-serif;
  --accent:var(--a-bol);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1814; --paper:#25211b; --paper-edge:#3a332a;
  --ink:#efe7da; --muted:#a89c8c;
  --green:#8bbd9b; --green-pale:#2b3a30;
  --a-pizza:#e88a7f; --a-bol:#e0a564; --a-zd:#d2a679;
  --a-pale:#3a2c1c;
  --warn-bg:#3a241a; --warn-fg:#f0b394;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1814; --paper:#25211b; --paper-edge:#3a332a;
  --ink:#efe7da; --muted:#a89c8c;
  --green:#8bbd9b; --green-pale:#2b3a30;
  --a-pizza:#e88a7f; --a-bol:#e0a564; --a-zd:#d2a679;
  --a-pale:#3a2c1c;
  --warn-bg:#3a241a; --warn-fg:#f0b394;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.55;font-size:16px}
body[data-tab="pizza"]{--accent:var(--a-pizza)}
body[data-tab="bolletjes"]{--accent:var(--a-bol)}
body[data-tab="zuurdesem"]{--accent:var(--a-zd)}

/* Hero */
.hero{position:relative;height:290px;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 35%,#5a3a1c 0%,#2a1a0c 55%,#140c05 100%)}
.art{position:absolute;left:50%;top:34px;transform:translateX(-50%)}
.bun{width:250px;height:165px;border-radius:50% 50% 44% 44%/62% 62% 38% 38%;position:relative;
  background:radial-gradient(ellipse 45% 32% at 38% 28%,#ffe2a6 0%,transparent 70%),radial-gradient(ellipse at 50% 30%,#e7a14c 0%,#c9782b 45%,#8e4d18 100%);
  box-shadow:0 26px 40px rgba(0,0,0,.55),inset 0 -14px 22px rgba(70,30,5,.45)}
.seed{position:absolute;width:7px;height:4px;border-radius:50%;background:#f7ecd2}
.seed.d{background:#2b2420}
.pz{width:210px;height:210px;border-radius:50%;position:relative;margin-top:-10px;
  background:radial-gradient(circle at 50% 50%,#b53a2a 0 66%,#d9a05a 69%,#e9be7d 78%,#8e5420 100%);box-shadow:0 22px 40px rgba(0,0,0,.6)}
.pz i{position:absolute;border-radius:45%;background:#f6efe0}
.pz b{position:absolute;width:20px;height:11px;border-radius:0 80% 0 80%;background:#3f7a3c}
.loaf{width:270px;height:160px;border-radius:50%/56%;position:relative;
  background:radial-gradient(ellipse 50% 30% at 40% 25%,rgba(255,230,190,.35),transparent 70%),radial-gradient(ellipse at 50% 40%,#b0703a 0%,#7c4a22 60%,#4a2a12 100%);
  box-shadow:0 26px 40px rgba(0,0,0,.6),inset 0 -12px 20px rgba(30,12,2,.5)}
.loaf::before{content:"";position:absolute;left:30%;top:22%;width:46%;height:24%;border-radius:50%;border-top:9px solid #e8c48f;transform:rotate(-14deg)}
.loaf::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 25% 60%,rgba(255,255,255,.25) 0 2px,transparent 3px) 0 0/22px 18px;opacity:.7}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(10,6,2,.85) 100%)}
.hero-text{position:absolute;left:0;right:0;bottom:0;text-align:center;padding-block:0 1.4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--hero-ink)}
.stripes{display:flex;justify-content:center;gap:5px;margin-bottom:.7rem}
.stripes i{width:4px;height:24px;border-radius:2px}
.brand{font-family:var(--display);font-style:italic;font-size:1.05rem;letter-spacing:.04em;color:#f0c27e;margin-bottom:.15rem}
.hero h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1.05;margin:0}
.hero h1 em{font-style:italic;color:#f0c27e}
.hero p{margin:.35rem 0 0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}

/* Tabs */
.tabs{max-width:620px;margin:-1px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:1rem 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs a{text-decoration:none;text-align:center;padding:.7rem .3rem;border-radius:6px;border:1px solid var(--paper-edge);color:var(--muted);background:var(--paper);font-size:.92rem;line-height:1.2}
.tabs a small{display:block;font-size:.72rem;opacity:.85}
.tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.tabs a:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.wrap{max-width:620px;margin:0 auto;padding-block:1.2rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:1.3rem}
.card{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;padding:1.4rem 1.3rem;box-shadow:0 1px 0 var(--paper-edge),0 8px 22px -14px rgba(60,40,15,.35);min-width:0}
.label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h2{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:.2rem 0 0;line-height:1.15;text-wrap:balance}

.counter{display:flex;align-items:center;justify-content:center;gap:1.4rem;margin:.9rem 0 .4rem}
.counter button{width:52px;height:52px;border-radius:50%;border:1px solid var(--paper-edge);background:var(--bg);color:var(--ink);font-size:1.6rem;font-family:var(--body);cursor:pointer}
.counter button:hover{background:var(--green-pale)}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.count{font-family:var(--display);font-size:3.6rem;font-weight:600;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.sub{text-align:center;color:var(--muted);font-size:.9rem}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:1rem;background:var(--bg);padding:5px;border-radius:999px;border:1px solid var(--paper-edge)}
.seg button{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:.88rem;padding:.55rem .3rem;border-radius:999px;cursor:pointer;line-height:1.2}
.seg button small{display:block;font-size:.72rem;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg);font-weight:500}
.warn{margin-top:1rem;background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:.7rem .9rem;font-size:.88rem}

.ing{list-style:none;margin:1rem 0 0;padding:0;display:grid}
.ing li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;padding:.6rem 0;border-bottom:1px dashed var(--paper-edge);align-items:baseline}
.ing li:last-child{border-bottom:0}
.ing .amt{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .note{display:block;font-size:.78rem;color:var(--muted)}
.ing .grp{display:block;padding-top:.9rem;border-bottom:0;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}
.total{margin-top:.8rem;display:flex;justify-content:space-between;gap:.4rem 1rem;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.total b{color:var(--ink);font-weight:500}

.plan-in{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:.8rem}
.plan-in input{font-family:var(--body);font-size:1.1rem;padding:.45rem .7rem;border:1px solid var(--paper-edge);border-radius:6px;background:var(--bg);color:var(--ink)}
.tl{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.2rem}
.tl li{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:.8rem;font-size:.92rem}
.tl time{font-variant-numeric:tabular-nums;font-weight:500;color:var(--green)}
.tl li.mk span{font-style:italic;color:var(--muted)}
.tl li.go time{color:var(--accent)}
.tl .day{grid-column:1/-1;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500;padding-top:.6rem}

.steps{display:grid;gap:1.3rem;margin-top:1rem}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.9rem}
.num{font-family:var(--display);font-size:1.9rem;font-weight:600;color:var(--accent);line-height:1}
.step h3{margin:0;font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.2}
.step h3 span{font-family:var(--body);font-size:.78rem;font-weight:400;color:var(--muted);margin-left:.4rem}
.step p{margin:.3rem 0 0;max-width:62ch}
.step b,.card p b{font-weight:500}
.tip{margin-top:.6rem;background:var(--green-pale);border-radius:5px;padding:.55rem .75rem;font-size:.86rem}
.tip.a{background:var(--a-pale)}

.oven{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1rem;text-align:center}
.oven div{background:var(--bg);border:1px solid var(--paper-edge);border-radius:6px;padding:.8rem .3rem}
.oven strong{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.1}
.oven span{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h4{font-family:var(--display);font-size:1.2rem;font-weight:600;margin:1.2rem 0 0}
.card ol.plain{margin:.4rem 0 0;padding-left:1.2rem}
footer{text-align:center;font-size:.85rem;color:var(--muted);font-style:italic;font-family:var(--display)}
footer a{color:inherit}
</style>

<style>html,body{margin:0}html{background:var(--bg)}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<header class="hero">
  <div class="art" id="art"></div>
  <div class="hero-shade"></div>
  <div class="hero-text">
    <div class="stripes" id="stripes"><i></i><i></i><i></i></div>
    <div class="brand">Rogier's Bakboek</div>
    <h1 id="heroTitle">Bakboek</h1>
    <p id="heroSub"></p>
  </div>
</header>

<nav class="tabs" aria-label="Recepten">
  <a href="#pizza" data-tab="pizza">Pizza<small>deegbollen</small></a>
  <a href="#bolletjes" data-tab="bolletjes">Bolletjes<small>wit &amp; zacht</small></a>
  <a href="#zuurdesem" data-tab="zuurdesem">Zuurdesem<small>brood</small></a>
</nav>

<main class="wrap">
  <section class="card">
    <div class="label" id="cLabel">Hoeveel maak je?</div>
    <h2 id="cTitle"></h2>
    <div class="counter">
      <button type="button" id="min" aria-label="Eén minder">−</button>
      <div class="count" id="count" aria-live="polite"></div>
      <button type="button" id="plus" aria-label="Eén meer">+</button>
    </div>
    <div class="sub" id="countSub"></div>
    <div id="toggles"></div>
    <div class="warn" id="warn" hidden></div>
  </section>

  <section class="card">
    <div class="label">Boodschappen</div>
    <h2>Ingrediënten</h2>
    <ul class="ing" id="ing"></ul>
    <div class="total" id="total"></div>
  </section>

  <section class="card">
    <div class="label">Terugrekenen</div>
    <h2 id="planQ"></h2>
    <div class="plan-in">
      <input type="time" id="eat" aria-label="Tijd dat het klaar moet zijn">
      <span class="sub" id="startAt"></span>
    </div>
    <ol class="tl" id="tl"></ol>
  </section>

  <section class="card">
    <div class="label">Werkwijze</div>
    <h2>Zo maak je het</h2>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card" id="ovenCard"></section>
  <section class="card" id="extraCard" hidden></section>

  <footer id="foot"></footer>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var r5=function(x){return Math.round(x/5)*5};
  var hlf=function(x){return Math.round(x*2)/2};
  var frac=function(x){var w=Math.floor(x),f=x-w;return (w?w:'')+(f?'½':'')||'½'};
  var zak=function(g){if(g<6.5)return 'minder dan 1 zakje';var z=hlf(g/7);return z<=1?'± 1 zakje':'± '+frac(z)+' zakjes (7 g)'};
  var FLOUR_MAX=1350;

  var state={tab:'pizza',
    pizza:{count:3,method:'snel',eat:'18:30'},
    bolletjes:{count:10,size:125,liq:'room',eat:'18:00'},
    zuurdesem:{count:1,method:'koel',eat:'12:00'}};
  try{var s=JSON.parse(localStorage.getItem('bakboek')||'null');if(s){['pizza','bolletjes','zuurdesem'].forEach(function(k){if(s[k])Object.assign(state[k],s[k])});}}catch(e){}
  function save(){try{localStorage.setItem('bakboek',JSON.stringify(state))}catch(e){}}

  /* ---------- Recepten ---------- */
  var R={};

  R.pizza={
    title:'Pizza<em> deeg</em>', sub:'Napolitaans · oven of kamado', stripes:['#4a7a5a','#efe7da','#b03a30'],
    cTitle:'Aantal pizzabollen', min:1, max:20,
    unit:function(st){return (st.count===1?'bol':'bollen')+' van ±270 g'},
    toggles:[{key:'method',opts:[['snel','Snel','± 1 uur'],['lang','Langzaam','8 uur rijzen']]}],
    planQ:'Wanneer wil je eten?',
    calc:function(st){
      var f=st.count/3, snel=st.method==='snel';
      var flour=Math.round(500*f), water=Math.round(315*f), yeast=snel?hlf(7*f):Math.max(0.5,hlf(1.5*f));
      var rows=[['Pizzabloem',flour+' g','type 0 / W250'],['Water',water+' g',snel?'warm, ±38°C':'kamertemperatuur'],['Zout',Math.round(10*f)+' g',''],['Droge gist',yeast+' g',snel?zak(yeast):'weinig gist, trage rijs']];
      if(snel)rows.push(['Olijfolie',Math.round(10*f)+' g','maakt het deeg soepeler']);
      rows.push(['Semolabloem','om uit te rekken','']);
      var mix='Doe in de KitchenAid met deeghaak het <b>water ('+water+' g)</b> en de <b>gist</b> en roer 1 minuut. Voeg de <b>bloem ('+flour+' g)</b> toe en kneed 3–4 minuten op een lage stand. Voeg het <b>zout</b>'+(snel?' en de <b>olijfolie</b>':'')+' toe en kneed nog 2 minuten. Stop zodra het deeg glad en licht elastisch is.';
      var steps=[['Mengen','5 min',mix,'Niet perfect is prima.']];
      if(snel){
        steps.push(['Snelle rijs','30 min','Maak er een bal van en leg hem in een licht ingevette kom. Dek af met een <b>natte theedoek</b> en zet hem op een warme plek van 24–28°C, bijvoorbeeld in de oven met alleen het lampje aan. Het deeg moet ongeveer verdubbelen.','Onder de 21°C rijst het deeg te traag voor deze snelle methode.']);
        steps.push(['Bollen maken','15 min','Verdeel in <b>'+st.count+' '+(st.count===1?'bol':'bollen')+' van ±270 g</b>. Laat ze nog 10–15 minuten afgedekt rusten.']);
      }else{
        steps.push(['Lange rijs','8 uur','Leg het deeg in een licht ingevette kom, dek af met een <b>natte theedoek</b> en laat het 8 uur rijzen op kamertemperatuur (±20°C). De lange rijs geeft meer smaak en een soepel deeg, zonder olie.']);
        steps.push(['Bollen maken','1 uur voor bakken','Verdeel in <b>'+st.count+' '+(st.count===1?'bol':'bollen')+' van ±270 g</b>. Laat ze afgedekt 1 uur narijzen voordat je gaat bakken.']);
      }
      steps.push(['Uitrekken & bakken','','Bestrooi het aanrecht met <b>semolabloem</b> en druk de bol vanuit het midden naar buiten uit. Laat de rand dik voor een luchtige korst. Beleg en bak direct.','Semola plakt minder dan gewone bloem, zo glijdt de pizza makkelijk van de schep.']);
      var bake=st.count*5;
      var blocks=snel?[['Deeg maken',10],['Snelle rijs',30],['Bollen maken + rust',15],['Pizza\'s bakken',bake]]:[['Deeg maken',10],['Lange rijs',480],['Bollen maken + narijzen',60],['Pizza\'s bakken',bake]];
      return {rows:rows,total:'Totaal deeg <b>± '+Math.round(st.count*270)+' g</b>',flour:flour,steps:steps,blocks:blocks,
        marks:[['Kamado of oven aansteken',-(bake+45)]],
        foot:'Jouw eigen pizzadeegrecept · basis 3 bollen van 270 g'};
    },
    oven:function(st){return '<div class="label">Bakken</div><h2>Oven of kamado</h2>'+
      '<h4>Heteluchtoven</h4><div class="oven"><div><strong>250°</strong><span>maximaal</span></div><div><strong>8–10</strong><span>minuten</span></div><div><strong>steen</strong><span>mee opwarmen</span></div></div>'+
      '<div class="tip">Zet de pizzasteen of bakplaat mee in de koude oven en laat hem minstens 30 minuten opwarmen.</div>'+
      '<h4>Big Green Egg (kamado)</h4><div class="oven"><div><strong>350°</strong><span>stoken tot</span></div><div><strong>± 4</strong><span>minuten</span></div><div><strong>'+st.count+'</strong><span>'+(st.count===1?'pizza':'pizza\'s')+'</span></div></div>'+
      '<ol class="plain"><li>Plaats de <b>convEGGtor</b> (indirecte plaat) onderin</li><li>Leg het <b>rooster</b> erop</li><li>Leg de <b>pizzasteen</b> op het rooster en stook op tot 350°C</li></ol>';}
  };

  R.bolletjes={
    title:'Witte <em>Bolletjes</em>', sub:'Zacht · fluffy · uit de oven', stripes:['#efe3c8','#d99a4e','#8e4d18'],
    cTitle:'Aantal bolletjes', min:1, max:40,
    unit:function(st){return (st.count===1?'bolletje':'bolletjes')+' van ±'+st.size+' g'},
    toggles:[{key:'size',num:true,opts:[[80,'Klein','±80 g'],[125,'Normaal','±125 g'],[155,'Groot','±155 g · burger']]},
             {key:'liq',opts:[['room','Melk + slagroom','rijker, zachter'],['melk','Alleen melk','lichter']]}],
    planQ:'Wanneer wil je eten?',
    calc:function(st){
      var f=st.count*st.size/1250, room=st.liq==='room';
      var milk=room?r5(200*f):r5(400*f), cream=room?r5(200*f):0;
      var f1=Math.round(300*f), f2=Math.round(350*f), yeast=hlf(8*f), salt=Math.round(12*f);
      var egg=Math.max(0.5,hlf(f)), yolk=Math.max(1,Math.round(f));
      var per=st.size===80?16:st.size===125?12:9, trays=Math.ceil(st.count/per);
      var rows=[['grp','Voordeeg'],['Melk',milk+' ml','lauwwarm']];
      if(cream)rows.push(['Slagroom',cream+' ml','lauwwarm, samen met de melk']);
      rows=rows.concat([['Bloem',f1+' g','eerste deel'],['Roomboter',Math.round(60*f)+' g','zacht'],['Suiker',Math.round(60*f)+' g','minder mag, minimaal '+Math.max(5,Math.round(10*f))+' g'],['Droge gist',yeast+' g',zak(yeast)],
        ['grp','Hoofddeeg'],['Ei',frac(egg)+' ei','≈ '+Math.round(50*f)+' g, losgeklopt'],['Zout',salt+' g',''],['Bloem',f2+' g','tweede deel'],
        ['grp','Insmeren'],['Eidooier',yolk+'×',''],['Griekse yoghurt',yolk+' el','of wat slagroom'],['Sesam / maanzaad','naar smaak','optioneel']]);
      var liquid=cream?milk+' ml melk en '+cream+' ml slagroom':milk+' ml melk';
      var steps=[
        ['Voordeeg','30 min','Verwarm <b>'+liquid+'</b> tot het lauw is. Als je er een vinger in houdt en "au" wilt roepen, is het te warm en gaat de gist dood. Meng in een kom met <b>'+f1+' g bloem</b>, de boter, suiker en gist. Kort mengen, dan 30 minuten afdekken met een theedoek.','Na een half uur is het voordeeg flink gegroeid. Zo weet je meteen dat je gist leeft.'],
        ['Kneden','10 min','Voeg <b>'+frac(egg)+' ei</b>, <b>'+salt+' g zout</b> en <b>'+f2+' g bloem</b> toe. Kneed ±10 minuten met de hand, of ±8 minuten met de deeghaak op een lage stand. Het deeg mag een klein beetje plakken. Plakt het veel, dan is het nog niet lang genoeg gekneed.','Lang genoeg kneden is het geheim van een fluffy bolletje.'],
        ['Eerste rijs','1–2 uur','Dek de kom af en laat het deeg verdubbelen. Hoe warmer de keuken, hoe sneller.'],
        ['Vormen','15 min','Sla de lucht eruit en verdeel het deeg in <b>'+st.count+' stukjes van ±'+st.size+' g</b>. Leg je hand als een kommetje over een stukje en draai het over het aanrecht rond, zo zet je het deeg op spanning. Leg ze op '+(trays>1?trays+' bakplaten':'een bakplaat')+' met bakpapier.','Weeg de stukjes af, dan worden ze allemaal even groot en even snel gaar.'],
        ['Tweede rijs','± 45 min','Dek weer af en laat ze verdubbelen. Handig: in de oven met alleen het lampje aan.'],
        ['Insmeren & bakken','12–15 min','Klop <b>'+yolk+' eidooier'+(yolk>1?'s':'')+'</b> los met <b>'+yolk+' el Griekse yoghurt</b> en smeer de bolletjes in. Strooi er eventueel sesam of maanzaad over. Bak 12–15 minuten op <b>180°C</b>.']];
      return {rows:rows,total:'Totaal deeg <b>± '+(st.count*st.size).toLocaleString('nl-NL')+' g</b></span><span>Bakplaten <b>'+trays+' × (±'+per+' per plaat)</b>',flour:f1+f2,steps:steps,
        blocks:[['Voordeeg maken',35],['Kneden',15],['Eerste rijs',90],['Vormen',15],['Tweede rijs + oven voorverwarmen',45],['Bakken'+(trays>1?' ('+trays+' platen)':''),15*trays+5]],marks:[],
        foot:'Naar het recept uit de WhatsApp-groep · basis 10 bolletjes van 125 g'};
    },
    oven:function(){return '<div class="label">Bakken</div><h2>In de oven</h2><div class="oven"><div><strong>180°</strong><span>boven/onder</span></div><div><strong>12–15</strong><span>minuten</span></div><div><strong>midden</strong><span>richel</span></div></div>'+
      '<div class="tip a">Rijzen ze in de oven met alleen het lampje aan? Haal ze er dan eerst uit voordat je gaat voorverwarmen.</div>'+
      '<div class="tip">Hetelucht: zet hem op ±170°C. Klaar als ze goudbruin zijn en hol klinken als je op de onderkant tikt. Kijk de eerste keer na 12 minuten.</div>'+
      '<div class="tip">Meerdere bakplaten? Bak ze één voor één en zet de volgende plaat zolang koel weg, dan rijzen ze niet te ver door.</div>';}
  };

  R.zuurdesem={
    title:'Zuurdesem<em>brood</em>', sub:'Starter · rijsmand · gietijzeren pan', stripes:['#f2ead8','#c9a06a','#5a3418'],
    cTitle:'Aantal broden', min:1, max:4,
    unit:function(st){return (st.count===1?'brood':'broden')+' van ±930 g deeg'},
    toggles:[{key:'method',opts:[['koel','Koelkast','12 u · bak morgen'],['dag','Zelfde dag','3 u rijzen']]}],
    planQ:'Wanneer wil je het brood aansnijden?',
    calc:function(st){
      var n=st.count, koel=st.method==='koel';
      var rows=[['Tarwebloem',(500*n)+' g','bij voorkeur biologisch'],['Water',(300*n)+' ml','lauwwarm'],['Zuurdesemstarter',(125*n)+' g','actief, met bubbels'],['Zout',(8*n)+' g',''],['Olie','beetje','om de kom in te vetten']];
      var steps=[
        ['Starter voeden','4–12 uur vooraf','Je hebt <b>'+(125*n)+' g actieve starter</b> nodig. Voed hem op tijd met gelijke delen bloem en water, zodat hij op het moment van mengen vol bubbels zit.','Testje: een lepel starter in een glas water blijft drijven als hij klaar is.'],
        ['Mengen','5 min + 30 min rust','Meng het <b>lauwe water ('+(300*n)+' ml)</b> met de <b>bloem</b>, <b>starter</b> en het <b>zout</b>. Kneed 5 minuten met de deeghaken op de middelste stand tot een soepel deeg. Dek af met een vochtige theedoek en laat 30 minuten staan.'],
        ['Vouwen','5 min','Maak je handen nat. Rek een stuk deeg aan de rand voorzichtig uit en vouw het naar binnen. Ga rondom tot de hele rand naar binnen is gevouwen. Leg het deeg in een licht ingevette kom en dek af met een vochtige theedoek.'],
        koel?['Koude rijs','12 uur','Zet de kom 12 uur in de koelkast. De koude rijs geeft een vollere, zuurdere smaak en het deeg is daarna makkelijker te vormen.']
            :['Rijzen','3 uur','Laat het deeg 3 uur rijzen op een warme plek. Hoe warmer de keuken, hoe sneller.'],
        ['Vormen & rijsmand','1,5 uur','Leg het deeg op een licht bebloemd werkblad'+(n>1?' en verdeel het in <b>'+n+' gelijke stukken</b>':'')+'. Vorm een bol door de onderkant met draaiende bewegingen naar binnen te duwen. Leg hem met de naad naar boven in een bebloemde rijsmand en druk de naad dicht. Laat 1,5 uur rijzen op een warme plek.','Geen rijsmand? Een schone, bebloemde theedoek in een vergiet of kom werkt ook. Het deeg is klaar als het na licht indrukken langzaam terugveert.'],
        ['Bakken','40–45 min','Verwarm de oven met de <b>gietijzeren pan en deksel</b> erin voor op <b>240°C</b>. Keer het deeg op bakpapier, gladde kant boven, en maak met een scherp mesje één snede over het midden. Til het met het bakpapier in de hete pan. Bak <b>25 minuten met deksel</b> en daarna <b>15–20 minuten zonder</b>, tot het brood goudbruin is.','Laat het brood helemaal afkoelen voordat je het aansnijdt. Binnenin bakt het nog na.']];
      var bake=45*n;
      var blocks=[['Mengen + rust',35],['Vouwen',10],[koel?'Koude rijs (koelkast)':'Rijzen',koel?720:180],['Vormen',10],['Rijzen in rijsmand',90],['Bakken'+(n>1?' ('+n+' broden na elkaar)':''),bake],['Afkoelen',60]];
      return {rows:rows,total:'Totaal deeg <b>± '+(933*n).toLocaleString('nl-NL')+' g</b></span><span>Hydratatie <b>± 64%</b>',flour:500*n,steps:steps,blocks:blocks,
        marks:[['Starter voeden',-99999],['Oven + pan voorverwarmen',-(bake+60+45)]],
        foot:'Naar het Allerhande-recept voor <a href="https://www.ah.nl/allerhande/recept/R-R1201850/biologisch-zuurdesembrood-bakken" target="_blank" rel="noopener">biologisch zuurdesembrood</a> · basis 1 brood'};
    },
    oven:function(st){return '<div class="label">Bakken</div><h2>In de gietijzeren pan</h2><div class="oven"><div><strong>240°</strong><span>voorverwarmd</span></div><div><strong>25</strong><span>min met deksel</span></div><div><strong>15–20</strong><span>min zonder</span></div></div>'+
      '<div class="tip a">De deksel houdt de stoom vast. Daardoor kan het brood eerst flink rijzen voordat de korst hard wordt.</div>'+
      '<div class="tip">Gaar als het hol klinkt bij tikken op de onderkant.'+(st.count>1?' Eén pan? Bak de broden na elkaar en laat de volgende zolang in de rijsmand in de koelkast wachten.':'')+'</div>';},
    extra:function(){return '<div class="label">Nog geen starter?</div><h2>Zelf een starter maken</h2>'+
      '<p>Dit duurt ongeveer een week. Je hebt volkorenmeel en lauw water nodig.</p>'+
      '<ol class="plain"><li><b>Dag 1:</b> weeg een schone pot en noteer het gewicht. Meng 50 g volkorenmeel met 50 ml lauw water tot een glad papje. Dek losjes af en zet op een warme plek zonder tocht of zon.</li>'+
      '<li><b>Dag 2 t/m 7:</b> roer er elke dag 50 g volkorenmeel en 50 ml lauw water door.</li>'+
      '<li><b>Klaar:</b> na ±7 dagen zit hij vol bubbels en ruikt hij licht zuur. Een grijs laagje vocht erop is normaal; roer het erdoor.</li></ol>'+
      '<div class="tip">Bak je niet elke week? Bewaar de starter afgedekt in de koelkast en voed hem elke 7 tot 14 dagen. Vul de pot nooit meer dan driekwart, want hij rijst.</div>';}
  };

  /* ---------- Hero art ---------- */
  function art(tab){
    var el=$('art');el.innerHTML='';
    if(tab==='pizza'){var p=document.createElement('div');p.className='pz';
      [[30,30,26,20],[58,24,22,18],[46,52,28,22],[24,58,20,16],[64,58,24,20],[42,76,20,14]].forEach(function(c){var i=document.createElement('i');i.style.cssText='left:'+c[0]+'%;top:'+c[1]+'%;width:'+c[2]+'px;height:'+c[3]+'px';p.appendChild(i)});
      [[40,40,20],[60,44,-40],[34,70,60],[56,72,10]].forEach(function(c){var b=document.createElement('b');b.style.cssText='left:'+c[0]+'%;top:'+c[1]+'%;transform:rotate('+c[2]+'deg)';p.appendChild(b)});
      el.appendChild(p);}
    else if(tab==='bolletjes'){var b=document.createElement('div');b.className='bun';
      [[30,20],[45,14],[60,22],[72,15],[38,34],[55,32],[68,36],[48,46],[32,48],[62,50],[78,28],[24,32]].forEach(function(c,i){var s=document.createElement('i');s.className='seed'+(i%3===0?' d':'');s.style.cssText='left:'+c[0]+'%;top:'+c[1]+'%;transform:rotate('+(i*37%180)+'deg)';b.appendChild(s)});
      el.appendChild(b);}
    else{var l=document.createElement('div');l.className='loaf';el.appendChild(l);}
  }

  /* ---------- Render ---------- */
  function render(){
    var tab=state.tab, rc=R[tab], st=state[tab], out=rc.calc(st);
    document.body.dataset.tab=tab;
    document.querySelectorAll('.tabs a').forEach(function(a){if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
    art(tab);
    $('heroTitle').innerHTML=rc.title; $('heroSub').textContent=rc.sub;
    var sp=$('stripes').children; rc.stripes.forEach(function(c,i){sp[i].style.background=c});
    $('cTitle').textContent=rc.cTitle; $('count').textContent=st.count; $('countSub').textContent=rc.unit(st);
    $('toggles').innerHTML=rc.toggles.map(function(t){return '<div class="seg" role="group">'+t.opts.map(function(o){
      return '<button type="button" id="t-'+tab+'-'+t.key+'-'+o[0]+'" data-key="'+t.key+'" data-val="'+o[0]+'" data-num="'+(t.num?1:0)+'" aria-pressed="'+(st[t.key]==o[0])+'">'+o[1]+'<small>'+o[2]+'</small></button>'}).join('')+'</div>'}).join('');
    var w=$('warn'); if(out.flour>FLOUR_MAX){w.hidden=false;w.textContent='Let op: '+out.flour.toLocaleString('nl-NL')+' g bloem past niet in één KitchenAid-kom. Maak het deeg in twee porties.'}else w.hidden=true;
    $('ing').innerHTML=out.rows.map(function(r){if(r[0]==='grp')return '<li class="grp">'+r[1]+'</li>';
      return '<li><span>'+r[0]+(r[2]?'<span class="note">'+r[2]+'</span>':'')+'</span><span class="amt">'+r[1]+'</span></li>'}).join('');
    $('total').innerHTML='<span>'+out.total+'</span>';
    $('steps').innerHTML=out.steps.map(function(s,i){return '<div class="step"><div class="num">'+(i+1)+'</div><div><h3>'+s[0]+(s[1]?'<span>'+s[1]+'</span>':'')+'</h3><p>'+s[2]+'</p>'+(s[3]?'<div class="tip">'+s[3]+'</div>':'')+'</div></div>'}).join('');
    $('ovenCard').innerHTML=rc.oven(st);
    var ex=$('extraCard'); if(rc.extra){ex.hidden=false;ex.innerHTML=rc.extra()}else{ex.hidden=true;ex.innerHTML=''}
    $('foot').innerHTML=out.foot;
    $('planQ').textContent=rc.planQ; $('eat').value=st.eat;
    plan(out); save();
  }

  function plan(out){
    var p=(state[state.tab].eat||'18:00').split(':'), eat=(+p[0])*60+(+p[1]);
    var total=out.blocks.reduce(function(a,b){return a+b[1]},0), t=eat-total, items=[];
    out.blocks.forEach(function(b){items.push({m:t,txt:b[0]});t+=b[1]});
    var start=eat-total;
    out.marks.forEach(function(mk){var m=mk[1]===-99999?start-360:eat+mk[1];items.push({m:m,txt:mk[0],mk:true})});
    items.sort(function(a,b){return a.m-b.m});
    items.push({m:eat,txt:state.tab==='zuurdesem'?'Aansnijden':'Smakelijk eten',go:true});
    var fmt=function(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
    var dayName=function(d){return d===0?'Op de dag zelf':d===-1?'De dag ervoor':(-d)+' dagen ervoor'};
    var dayOf=function(m){return Math.floor(m/1440)};
    var multi=dayOf(items[0].m)!==dayOf(eat), last=null, html='';
    items.forEach(function(it){var d=dayOf(it.m);if(multi&&d!==last){html+='<li class="day">'+dayName(d)+'</li>';last=d}
      html+='<li class="'+(it.mk?'mk':'')+(it.go?' go':'')+'"><time>'+fmt(it.m)+'</time><span>'+it.txt+'</span></li>'});
    $('tl').innerHTML=html;
    var first=items[0].m, dur=eat-first;
    $('startAt').textContent='Begin '+(dayOf(first)<dayOf(eat)?dayName(dayOf(first)).toLowerCase()+' ':'')+'om '+fmt(first)+' (±'+Math.floor(dur/60)+' u'+(dur%60?' '+(dur%60)+' min':'')+')';
  }

  /* ---------- Events ---------- */
  $('min').onclick=function(){var st=state[state.tab];if(st.count>R[state.tab].min){st.count--;render()}};
  $('plus').onclick=function(){var st=state[state.tab];if(st.count<R[state.tab].max){st.count++;render()}};
  $('toggles').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state[state.tab][b.dataset.key]=b.dataset.num==='1'?+b.dataset.val:b.dataset.val;render()});
  $('eat').addEventListener('input',function(){state[state.tab].eat=this.value||'18:00';plan(R[state.tab].calc(state[state.tab]));save()});
  function fromHash(){var h=location.hash.replace('#','');if(R[h]){state.tab=h}render()}
  window.addEventListener('hashchange',fromHash);
  if(!R[location.hash.replace('#','')]){try{var s=JSON.parse(localStorage.getItem('bakboek')||'null');if(s&&R[s.tab])state.tab=s.tab}catch(e){}}
  fromHash();
})();
</script>

</body>
</html>
