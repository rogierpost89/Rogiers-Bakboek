<style>
/* Layout: hero met wisselend baksel, tabs eronder, smalle kolom papieren kaarten. Accentkleur wisselt per recept. */
:root{
  --bg:#fcf9f3; --paper:#fffdf9; --paper-edge:#efe5d3;
  --ink:#2a231c; --muted:#7a6f63;
  --green:#4a7a5a; --green-pale:#d0e4d8;
  --a-pizza:#b03a30; --a-bol:#b8732c; --a-zd:#7a5230; --a-sb:#9a5a1e; --a-kk:#b8506f;
  --a-pale:#fbecd6;
  --warn-bg:#fbe7dc; --warn-fg:#8a3a1c;
  --hero-ink:#3a2a1c;
  color-scheme:light;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Jost','Helvetica Neue',Arial,sans-serif;
  --accent:var(--a-bol);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.55;font-size:16px}
body[data-tab="pizza"]{--accent:var(--a-pizza)}
body[data-tab="bolletjes"]{--accent:var(--a-bol)}
body[data-tab="zuurdesem"]{--accent:var(--a-zd)}
body[data-tab="stokbrood"]{--accent:var(--a-sb)}
body[data-tab="koekjes"]{--accent:var(--a-kk)}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--bg)}
.hero::before{content:"";position:absolute;left:50%;top:170px;width:300px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(140,90,40,.28),transparent 70%)}
.art{position:relative;height:clamp(230px,58vw,400px);background:#e9d6b8}
.art img{width:100%;height:100%;object-fit:cover;display:block;animation:artIn .5s ease both}
.art[data-tab="pizza"] img{object-position:42% 78%}
.art[data-tab="bolletjes"] img{object-position:62% 55%}
.art[data-tab="zuurdesem"] img{object-position:45% 45%}
.art[data-tab="stokbrood"] img{object-position:58% 60%}
.art[data-tab="koekjes"] img{object-position:50% 50%}
@keyframes artIn{from{opacity:.001}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.art img{animation:none}}
.mode{max-width:620px;margin:0 auto;padding-block:.8rem 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mode .label{display:block;text-align:center;margin-bottom:.35rem}
.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--paper-edge);border-radius:999px;padding:4px;box-shadow:0 4px 14px -8px rgba(140,80,30,.35)}
.switch::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transition:transform .28s cubic-bezier(.4,.1,.2,1)}
.switch[data-mode="bge"]::before{transform:translateX(100%)}
.switch button{position:relative;z-index:1;border:0;background:none;cursor:pointer;padding:.55rem .4rem;font-family:var(--body);font-size:.95rem;color:var(--muted);line-height:1.2;transition:color .2s}
.switch button small{display:block;font-size:.72rem;opacity:.85}
.switch button[aria-pressed="true"]{color:var(--bg);font-weight:500}
.switch button:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.switch::before{transition:none}}
.hero-shade{position:absolute;left:0;right:0;top:0;height:clamp(230px,58vw,400px);background:linear-gradient(to bottom,transparent 72%,var(--bg) 100%);pointer-events:none}
.hero-text{position:relative;margin-top:-1.4rem;text-align:center;padding-block:0 .4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--hero-ink)}
.stripes{display:none}

.stripes i{width:4px;height:24px;border-radius:2px}
.brand{display:inline-block;font-family:var(--display);font-style:italic;font-weight:600;font-size:1.3rem;letter-spacing:.02em;color:var(--ink);background:var(--paper);border:1px solid var(--paper-edge);border-radius:999px;padding:.15rem 1rem;margin-bottom:.45rem;box-shadow:0 4px 12px -6px rgba(140,80,30,.35)}
.hero h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1.05;margin:0}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{margin:.35rem 0 0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Tabs */
.tabs{max-width:620px;margin:-1px auto 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-block:1rem 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs a{text-decoration:none;text-align:center;padding:.65rem .15rem;letter-spacing:-.01em;border-radius:6px;border:1px solid var(--paper-edge);color:var(--muted);background:var(--paper);font-size:.92rem;line-height:1.2}
.tabs a small{display:block;font-size:.72rem;opacity:.85}
.tabs a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.tabs a:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.wrap{max-width:620px;margin:0 auto;padding-block:1.2rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:1.3rem}
.card{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;padding:1.4rem 1.3rem;box-shadow:0 1px 0 var(--paper-edge),0 8px 22px -14px rgba(60,40,15,.35);min-width:0}
.label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h2{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:.2rem 0 0;line-height:1.15;text-wrap:balance}

.counter{display:flex;align-items:center;justify-content:center;gap:1.4rem;margin:.9rem 0 .4rem}
.counter button{width:52px;height:52px;border-radius:50%;border:1px solid var(--paper-edge);background:var(--bg);color:var(--ink);font-size:1.6rem;font-family:var(--body);cursor:pointer}
.counter button:hover{background:var(--green-pale)}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.count{font-family:var(--display);font-size:3.6rem;font-weight:600;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.sub{text-align:center;color:var(--muted);font-size:.9rem}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:1rem;background:var(--bg);padding:5px;border-radius:999px;border:1px solid var(--paper-edge)}
.seg button{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:.88rem;padding:.55rem .3rem;border-radius:999px;cursor:pointer;line-height:1.2}
.seg button small{display:block;font-size:.72rem;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg);font-weight:500}
.warn{margin-top:1rem;background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:.7rem .9rem;font-size:.88rem}

.ing{list-style:none;margin:1rem 0 0;padding:0;display:grid}
.ing li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;padding:.6rem 0;border-bottom:1px dashed var(--paper-edge);align-items:baseline}
.ing li:last-child{border-bottom:0}
.ing .amt{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .note{display:block;font-size:.78rem;color:var(--muted)}
.ing .grp{display:block;padding-top:.9rem;border-bottom:0;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}
.total{margin-top:.8rem;display:flex;justify-content:space-between;gap:.4rem 1rem;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.total b{color:var(--ink);font-weight:500}

.plan-in{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:.8rem}
.plan-in input{font-family:var(--body);font-size:1.1rem;padding:.45rem .7rem;border:1px solid var(--paper-edge);border-radius:6px;background:var(--bg);color:var(--ink)}
.tl{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.2rem}
.tl li{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:.8rem;font-size:.92rem}
.tl time{font-variant-numeric:tabular-nums;font-weight:500;color:var(--green)}
.tl li.mk span{font-style:italic;color:var(--muted)}
.tl li.go time{color:var(--accent)}
.tl .day{grid-column:1/-1;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500;padding-top:.6rem}

.steps{display:grid;gap:1.3rem;margin-top:1rem}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.9rem}
.num{font-family:var(--display);font-size:1.9rem;font-weight:600;color:var(--accent);line-height:1}
.step h3{margin:0;font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.2}
.step h3 span{font-family:var(--body);font-size:.78rem;font-weight:400;color:var(--muted);margin-left:.4rem}
.step p{margin:.3rem 0 0;max-width:62ch}
.step b,.card p b{font-weight:500}
.tip{margin-top:.6rem;background:var(--green-pale);border-radius:5px;padding:.55rem .75rem;font-size:.86rem}
.tip.a{background:var(--a-pale)}

.oven{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1rem;text-align:center}
.oven div{background:var(--bg);border:1px solid var(--paper-edge);border-radius:6px;padding:.8rem .3rem}
.oven strong{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.1}
.oven span{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h4{font-family:var(--display);font-size:1.2rem;font-weight:600;margin:1.2rem 0 0}
.card ol.plain{margin:.4rem 0 0;padding-left:1.2rem}
.lang{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top, 0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr 1fr;width:96px;padding:3px;border-radius:999px;background:rgba(255,253,249,.88);border:1px solid var(--paper-edge);box-shadow:0 4px 14px -6px rgba(40,20,5,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--accent);transition:transform .28s cubic-bezier(.4,.1,.2,1)}
.lang[data-lang="en"]::before{transform:translateX(100%)}
.lang button{position:relative;z-index:1;border:0;background:none;cursor:pointer;padding:.38rem 0;font-family:var(--body);font-size:.8rem;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.lang::before{transition:none}}
@media (max-width:420px){.tabs{gap:4px}.tabs a{font-size:.74rem;padding:.6rem .05rem;letter-spacing:-.02em}.tabs a small{font-size:.62rem}}
</style>

<style>html,body{margin:0}html{background:#fffaf0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<header class="hero">
  <div class="art" id="art"></div>
  <div class="lang" id="lang" role="group" aria-label="Taal" data-lang="nl">
    <button type="button" id="l-nl" data-lang="nl" aria-pressed="true">NL</button>
    <button type="button" id="l-en" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="hero-shade"></div>
  <div class="hero-text">
    <div class="brand">Rogier's Bakboek</div>
    <h1 id="heroTitle">Bakboek</h1>
    <p id="heroSub"></p>
  </div>
</header>

<nav class="tabs" id="nav" aria-label="Recepten">
  <a href="#pizza" data-tab="pizza">Pizza<small>deegbollen</small></a>
  <a href="#bolletjes" data-tab="bolletjes">Bolletjes<small>wit &amp; zacht</small></a>
  <a href="#zuurdesem" data-tab="zuurdesem">Zuurdesem<small>brood</small></a>
  <a href="#stokbrood" data-tab="stokbrood">Stokbrood<small>baguette</small></a>
  <a href="#koekjes" data-tab="koekjes">Koekjes<small>fondant</small></a>
</nav>

<div class="mode">
  <span class="label" id="modeLabel">Waar bak je?</span>
  <div class="switch" id="switch" role="group" aria-labelledby="modeLabel" data-mode="oven">
    <button type="button" id="m-oven" data-mode="oven" aria-pressed="true">Oven<small>bakplaat of steen</small></button>
    <button type="button" id="m-bge" data-mode="bge" aria-pressed="false">Kamado<small>Big Green Egg</small></button>
  </div>
</div>

<main class="wrap">
  <section class="card">
    <div class="label" id="cLabel">Hoeveel maak je?</div>
    <h2 id="cTitle"></h2>
    <div class="counter">
      <button type="button" id="min" aria-label="Eén minder">−</button>
      <div class="count" id="count" aria-live="polite"></div>
      <button type="button" id="plus" aria-label="Eén meer">+</button>
    </div>
    <div class="sub" id="countSub"></div>
    <div id="toggles"></div>
    <div class="warn" id="warn" hidden></div>
  </section>

  <section class="card">
    <div class="label" id="lShop">Boodschappen</div>
    <h2 id="lIng">Ingrediënten</h2>
    <ul class="ing" id="ing"></ul>
    <div class="total" id="total"></div>
  </section>

  <section class="card">
    <div class="label" id="lBack">Terugrekenen</div>
    <h2 id="planQ"></h2>
    <div class="plan-in">
      <input type="time" id="eat" aria-label="Tijd dat het klaar moet zijn">
      <span class="sub" id="startAt"></span>
    </div>
    <ol class="tl" id="tl"></ol>
  </section>

  <section class="card">
    <div class="label" id="lMethod">Werkwijze</div>
    <h2 id="lMake">Zo maak je het</h2>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card" id="ovenCard"></section>
  <section class="card" id="extraCard" hidden></section>

</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var r5=function(x){return Math.round(x/5)*5};
  var hlf=function(x){return Math.round(x*2)/2};
  var frac=function(x){var w=Math.floor(x),f=x-w;return (w?w:'')+(f?'½':'')||'½'};
  var zak=function(g){if(g<6.5)return 'minder dan 1 zakje';var z=hlf(g/7);return z<=1?'± 1 zakje':'± '+frac(z)+' zakjes (7 g)'};
  var FLOUR_MAX=1350;

  var state={tab:'pizza',mode:'oven',lang:'nl',
    pizza:{count:3,method:'snel',eat:'18:30'},
    bolletjes:{count:10,size:125,liq:'room',eat:'18:00'},
    zuurdesem:{count:1,method:'koel',eat:'12:00'},
    stokbrood:{count:3,method:'gist',eat:'18:00'},
    koekjes:{count:20,kleur:'roze',tekst:'ja',eat:'16:00'}};
  try{var s=JSON.parse(localStorage.getItem('bakboek')||'null');if(s){if(s.mode==='bge'||s.mode==='oven')state.mode=s.mode;if(s.lang==='en'||s.lang==='nl')state.lang=s.lang;['pizza','bolletjes','zuurdesem','stokbrood','koekjes'].forEach(function(k){if(s[k])Object.assign(state[k],s[k])});}}catch(e){}
  function save(){try{localStorage.setItem('bakboek',JSON.stringify(state))}catch(e){}}

  /* ---------- Recepten ---------- */
  var R={};

  function defNL(R){
  var LOC='nl-NL';
  var K=function(){return state.mode==='bge'};
  var HEAD=function(){return '<div class="label">Bakken</div><h2>'+(K()?'Op de kamado':'In de oven')+'</h2>'};
  var CARE='<div class="tip a">Leg de steen altijd koud in de oven of BGE en warm hem mee op. Een koude steen in een hete oven kan barsten. Giet nooit water op de steen.</div>';
  var STONE=function(t){return '<h4>Met de pizzasteen in de oven</h4><p>'+t+'</p>'};
  var BGE=function(temp,time,what,tips){return '<h4>Big Green Egg (kamado), op de pizzasteen</h4><div class="oven"><div><strong>'+temp+'</strong><span>deksel-thermometer</span></div><div><strong>'+time+'</strong><span>minuten</span></div><div><strong>indirect</strong><span>convEGGtor</span></div></div>'+
    '<ol class="plain"><li>Plaats de <b>convEGGtor</b> (indirecte plaat) onderin</li><li>Leg het <b>rooster</b> erop</li><li>Leg de <b>pizzasteen</b> op het rooster en stook op tot '+temp+'C. Laat de temperatuur 20–30 minuten stabiel worden.</li><li>'+what+'</li></ol>'+(tips?'<div class="tip">'+tips+'</div>':'')};

  R.pizza={
    title:'Pizza<em> deeg</em>', sub:'Napolitaans · oven of kamado', stripes:['#4a7a5a','#efe7da','#b03a30'],
    cTitle:'Aantal pizzabollen', min:1, max:20,
    unit:function(st){return (st.count===1?'bol':'bollen')+' van ±270 g'},
    toggles:[{key:'method',opts:[['snel','Snel','± 2 uur'],['lang','Langzaam','8 uur rijzen']]}],
    planQ:'Wanneer wil je eten?',
    calc:function(st){
      var f=st.count/3, snel=st.method==='snel';
      var flour=Math.round(500*f), water=Math.round(315*f), yeast=snel?hlf(7*f):Math.max(0.5,hlf(1.5*f));
      var rows=[['Pizzabloem',flour+' g','type 0 / W250'],['Water',water+' g',snel?'warm, ±38°C':'kamertemperatuur'],['Zout',Math.round(10*f)+' g',''],['Droge gist',yeast+' g',snel?zak(yeast):'weinig gist, trage rijs']];
      if(snel)rows.push(['Olijfolie',Math.round(10*f)+' g','maakt het deeg soepeler']);
      rows.push(['Semolabloem','om uit te rekken','']);
      var mix='Doe in de KitchenAid met deeghaak het <b>water ('+water+' g)</b> en de <b>gist</b> en roer 1 minuut. Voeg de <b>bloem ('+flour+' g)</b> toe en kneed 3–4 minuten op een lage stand. Voeg het <b>zout</b>'+(snel?' en de <b>olijfolie</b>':'')+' toe en kneed nog 2 minuten. Stop zodra het deeg glad en licht elastisch is.';
      var steps=[['Mengen','5 min',mix,'Niet perfect is prima.']];
      if(snel){
        steps.push(['Eerste rijs','60 min','Maak er een bal van en leg hem in een licht ingevette kom. Dek af met een <b>natte theedoek</b> en zet hem op een warme plek van 24–28°C, bijvoorbeeld in de oven met alleen het lampje aan. Het deeg moet ongeveer verdubbelen.','Kouder dan 21°C? Geef het deeg dan 75–90 minuten.']);
        steps.push(['Bollen maken','10 min + 30–45 min rust','Verdeel in <b>'+st.count+' '+(st.count===1?'bol':'bollen')+' van ±270 g</b>. Laat ze 30–45 minuten afgedekt rusten. Dan ontspant het deeg en rek je het makkelijk uit zonder dat het terugtrekt.']);
      }else{
        steps.push(['Lange rijs','8 uur','Leg het deeg in een licht ingevette kom, dek af met een <b>natte theedoek</b> en laat het 8 uur rijzen op kamertemperatuur (±20°C). De lange rijs geeft meer smaak en een soepel deeg, zonder olie.']);
        steps.push(['Bollen maken','1 uur voor bakken','Verdeel in <b>'+st.count+' '+(st.count===1?'bol':'bollen')+' van ±270 g</b>. Laat ze afgedekt 1 uur narijzen voordat je gaat bakken.']);
      }
      steps.push(['Uitrekken & bakken','','Bestrooi het aanrecht met <b>semolabloem</b> en druk de bol vanuit het midden naar buiten uit. Laat de rand dik voor een luchtige korst. Beleg en bak direct.','Semola plakt minder dan gewone bloem, zo glijdt de pizza makkelijk van de schep.']);
      var bake=st.count*(K()?5:10);

  R.bolletjes={

        ['Kneden','10 min','Voeg <b>'+frac(egg)+' ei</b>, <b>'+salt+' g zout</b> en <b>'+f2+' g bloem</b> toe. Kneed ±10 minuten met de hand, of ±8 minuten met de deeghaak op een lage stand. Het deeg mag een klein beetje plakken. Plakt het veel, dan is het nog niet lang genoeg gekneed.','Lang genoeg kneden is het geheim van een fluffy bolletje.'],

  R.zuurdesem={
    title:'Zuurdesem<em>brood</em>', sub:'Starter · rijsmand · gietijzeren pan', stripes:['#f2ead8','#c9a06a','#5a3418'],

        ['Mengen','5 min + 30 min rust','Meng het <b>lauwe water ('+(300*n)+' ml)</b> met de <b>bloem</b>, <b>starter</b> en het <b>zout</b>. Kneed 5 minuten met de deeghaken op de middelste stand tot een soepel deeg. Dek af met een vochtige theedoek en laat 30 minuten staan.'],
        ['Vouwen','5 min','Maak je handen nat. Rek een stuk deeg aan de rand voorzichtig uit en vouw het naar binnen. Ga rondom tot de hele rand naar binnen is gevouwen. Leg het deeg in een licht ingevette kom en dek af met een vochtige theedoek.'],
        koel?['Rijzen & koude rijs','2 uur + 12 uur','Laat het deeg eerst 2 uur op het aanrecht rijzen, tot het zichtbaar luchtiger en ±50% gegroeid is. Zet de kom daarna 12 uur in de koelkast. De koude rijs geeft een vollere, zuurdere smaak en het deeg is daarna makkelijker te vormen.','Gaat het deeg meteen de koelkast in, dan heeft het te weinig tijd om te rijzen en wordt het brood compact.']

        ['Vormen & rijsmand','1,5 uur','Leg het deeg op een licht bebloemd werkblad'+(n>1?' en verdeel het in <b>'+n+' gelijke stukken</b>':'')+'. Vorm een bol door de onderkant met draaiende bewegingen naar binnen te duwen. Leg hem met de naad naar boven in een bebloemde rijsmand en druk de naad dicht. Laat 1,5 uur rijzen op een warme plek.','Geen rijsmand? Een schone, bebloemde theedoek in een vergiet of kom werkt ook. Het deeg is klaar als het na licht indrukken langzaam terugveert.'],
        ['Bakken','40–45 min',(K()?'Stook de kamado op tot <b>230°C</b> met de <b>gietijzeren pan en deksel</b> op de pizzasteen.':'Verwarm de oven met de <b>gietijzeren pan en deksel</b> erin voor op <b>240°C</b>.')+' Keer het deeg op bakpapier, gladde kant boven, en maak met een scherp mesje één snede over het midden. Til het met het bakpapier in de hete pan. Bak <b>25 minuten met deksel</b> en daarna <b>15–20 minuten zonder</b>, tot het brood goudbruin is.','Laat het brood helemaal afkoelen voordat je het aansnijdt. Binnenin bakt het nog na.']];
      var bake=45*n;
      var blocks=[['Mengen + rust',35],['Vouwen',10]].concat(koel?[['Rijzen op het aanrecht',120],['Koude rijs (koelkast)',720]]:[['Rijzen',180]],[['Vormen',10],['Rijzen in rijsmand',90],['Bakken'+(n>1?' ('+n+' broden na elkaar)':''),bake],['Afkoelen',60]]);

        marks:[['Starter voeden',-99999],K()?['Kamado aansteken, pan op de steen',-(bake+60+60)]:['Oven + pan voorverwarmen',-(bake+60+45)]],

    },
    oven:function(st){if(K())return HEAD()+BGE('230°','40–45','Zet de gietijzeren pan op de steen en laat hem 30 minuten mee opwarmen. Bak 25 minuten met de pandeksel erop en 15–20 minuten zonder, met de BGE-deksel steeds dicht.','Zonder pan kan het ook: leg het brood op bakpapier direct op de steen. De gesloten BGE houdt zelf veel vocht vast.')+CARE;

    extra:function(){return '<div class="label">Nog geen starter?</div><h2>Zelf een starter maken</h2>'+

        steps=[

      var b=Math.ceil(st.count/2);return HEAD()+'<h4>Op de steen, met stoom</h4><div class="oven"><div><strong>250°</strong><span>10 min stoom</span></div><div><strong>230°</strong><span>nog ±10 min</span></div><div><strong>¾ kop</strong><span>kokend water</span></div></div>'+

      (b>1?'<div class="tip">'+b+' rondes: zet de volgende baguettes zolang in de koelkast, dan rijzen ze niet te ver door.</div>':'')+CARE;},
    extra:function(){return '<div class="label">Tips &amp; trucs</div><h2>Als het niet lukt</h2>'+
      '<ol class="plain"><li><b>Kruim te dicht:</b> te kort gerezen of te weinig gekneed. Doe de vliestest en vergeet het vouwen niet.</li>'+

      '<li><b>Korst niet krokant:</b> te weinig stoom of de oven niet heet genoeg. Verwarm langer voor en zorg dat er in de eerste minuten echt stoom is.</li>'+
      '<li><b>Deeg scheurt bij vormen:</b> te koud of te strak. Laat het een paar minuten langer rusten.</li></ol>'+
      '<div class="tip">Een linnen doek met plooien houdt de baguettes in vorm. Bestuif hem met half bloem, half rijstbloem: rijstbloem plakt niet.</div>'+
      '<div class="tip a"><b>Bewaren:</b> het lekkerst op de dag zelf, de korst wordt \'s nachts zacht. Vries afgekoelde baguettes tot 1 maand in een luchtdichte zak. Opwarmen: zonder ontdooien 10–12 minuten op 180°C.</div>';}

  R.koekjes={
    title:'Fondant<em> Koekjes</em>', sub:'Botervast deeg · fondant · met naam',
    cTitle:'Aantal koekjes', min:1, max:150,

    toggles:[{key:'kleur',opts:[['roze','Roze','poederroze'],['ivoor','Ivoor','warm wit'],['blauw','Blauw','lichtblauw'],['geel','Geel','zacht geel']]},
             {key:'tekst',opts:[['ja','Met tekst','letterstempels'],['nee','Zonder tekst','alleen fondant']]}],
    planQ:'Wanneer moeten ze klaar zijn?',
    calc:function(st){

      var fond=Math.ceil(n*15*1.25/10)*10, trays=Math.ceil(n/20), flour=Math.round(200*f);
      var rows=[['grp','Koekjesdeeg'],['Roomboter',Math.round(150*f)+' g','ongezouten, op kamertemperatuur'],['Witte basterdsuiker',Math.round(100*f)+' g',''],['Eidooier',Math.max(1,Math.round(f))+'×',''],['Tarwebloem',flour+' g','plus wat om uit te rollen'],
        ['grp','Afwerking'],['Fondant',fond+' g','wit, inclusief restjes'],['Kleurpasta',st.kleur==='ivoor'?'heel weinig':'vleugje',{roze:'roze',ivoor:'geel of bruin',blauw:'blauw',geel:'geel'}[st.kleur]],['Eetbare lijm','beetje','of water of abrikozenjam, om te plakken'],['Maïzena of poedersuiker','beetje','om uit te rollen']];

      rows.push(['Geschulpte uitsteker','Ø 7 cm','voor koekje én fondant']);
      var steps=[
        ['Deeg maken','10 min','Kneed <b>'+Math.round(150*f)+' g zachte boter</b>, <b>'+Math.round(100*f)+' g suiker</b>, <b>'+Math.max(1,Math.round(f))+' eidooier'+(Math.round(f)>1?'s':'')+'</b> en <b>'+flour+' g bloem</b> tot een samenhangend deeg. Kneed niet langer dan nodig.','Er zit bewust geen bakpoeder in. Zo rijzen de koekjes niet en blijven ze mooi plat, zodat de fondant er strak op ligt.'],
        ['Rusten','1 uur','Druk het deeg tot een platte plak, verpak in vershoudfolie en leg het 1 uur in de koelkast.'],
        ['Uitrollen & uitsteken','20 min','Verwarm de oven voor op <b>175°C</b>. Rol het deeg tussen twee vellen bakpapier uit tot <b>5 mm</b> dik. Steek <b>'+n+' '+(n===1?'koekje':'koekjes')+'</b> uit met de geschulpte uitsteker en leg ze op bakpapier op '+(trays>1?trays+' bakplaten':'een bakplaat')+'. Kneed het restdeeg opnieuw en rol het weer uit.','Leg de uitgestoken koekjes 10 minuten in de koelkast voordat ze de oven in gaan. Dan blijven de schulpjes scherp.'],
        ['Bakken','12–15 min'+(trays>1?' per plaat':''),'Bak de koekjes tot de randjes net lichtbruin worden. Laat ze daarna <b>helemaal afkoelen</b> op een rooster, minstens 45 minuten.','Fondant op een warm koekje smelt en wordt plakkerig. Wacht echt tot ze koud zijn.'],
        ['Fondant kleuren & uitrollen','15 min','Kneed de <b>'+fond+' g fondant</b> soepel. Voeg met een tandenstoker <b>'+KL[st.kleur]+'</b> toe en kneed tot de kleur egaal is. Rol de fondant op wat maïzena uit tot <b>3 mm</b> en steek met dezelfde uitsteker de rondjes uit.','Kleur liever te licht dan te donker: fondant kleurt na een uur nog wat bij. Dek de fondant die je niet gebruikt af, anders droogt hij uit.']];
      if(txt)steps.push(['Tekst stempelen','± 1 min per koekje','Druk de tekst met de letterstempels in de <b>verse, zachte fondant</b>, direct na het uitsteken. Druk recht en gelijkmatig, niet te diep.','Houd het kort: ±14 tekens op de eerste regel en ±22 op de tweede, dan past het mooi op een koekje van 7 cm.']);
      steps.push(['Plakken & drogen','1–2 uur','Bestrijk elk koekje dun met eetbare lijm, een beetje water of abrikozenjam. Leg de fondant erop en druk hem zacht aan met een vlakke hand. Laat de koekjes 1–2 uur drogen voordat je ze inpakt.','Bewaar ze luchtdicht, koel en droog, tot ±2 weken. Niet in de koelkast: dan gaat de fondant zweten.']);
      var bake=15*trays+5;
      var blocks=[['Deeg maken',10],['Deeg rusten (koelkast)',60],['Uitrollen & uitsteken',20],['Bakken'+(trays>1?' ('+trays+' platen)':''),bake],['Afkoelen',45],['Fondant kleuren & uitrollen',15+Math.round(n*0.5)]];
      if(txt)blocks.push(['Tekst stempelen',Math.round(n*1)]);
      blocks.push(['Plakken',Math.round(n*0.5)+5],['Laten drogen',90]);
      var after=blocks.slice(3).reduce(function(a,b){return a+b[1]},0);

        marks:[K()?['Kamado aansteken',-(after+45)]:['Oven voorverwarmen op 175°C',-(after+20)]]};
    },
    oven:function(){if(K())return HEAD()+BGE('170°','12–15','Leg de koekjes op bakpapier op een bakplaat, zet die op de steen en sluit de deksel. Kijk na 10 minuten.','Houd de kamado laag, op 160–175°C, met de schuiven bijna dicht. Hij loopt makkelijk op, en koekjes verbranden snel.')+CARE;
      return HEAD()+'<h4>Op de bakplaat</h4><div class="oven"><div><strong>175°</strong><span>boven/onder</span></div><div><strong>12–15</strong><span>minuten</span></div><div><strong>midden</strong><span>richel</span></div></div>'+
      '<div class="tip a">Bak tot de randjes net beginnen te kleuren. Bleek in het midden is prima: zo blijven ze boterig en mooi licht onder de fondant.</div>'+
      '<div class="tip">Hetelucht: zet hem op ±160°C. Bak één plaat tegelijk en leg de volgende zolang in de koelkast.</div>'+
      STONE('Leg de koekjes op bakpapier op de steen. Ze krijgen meer onderwarmte, dus kijk na 10 minuten of de onderkant niet te donker wordt.')+CARE;},
    extra:function(){return '<div class="label">Tips &amp; trucs</div><h2>Strak resultaat</h2>'+
      '<ol class="plain"><li><b>Luchtbelletje in de fondant?</b> Prik het door met een naald en strijk het glad.</li>'+
      '<li><b>Fondant plakt?</b> Gebruik iets meer maïzena, of laat je handen even afkoelen. Warme handen maken fondant zacht.</li>'+
      '<li><b>Koekjes lopen uit?</b> Het deeg was te warm. Laat het langer rusten en leg de uitgestoken koekjes vóór het bakken in de koelkast.</li>'+
      '<li><b>Fondant past niet precies?</b> Steek fondant en koekje met dezelfde uitsteker uit. De fondant krimpt niet, het koekje een klein beetje.</li></ol>'+
      '<div class="tip">Maak de koekjes gerust een dag van tevoren. Gebakken koekjes zonder fondant blijven luchtdicht bewaard een week goed.</div>';}
  };
  }

  function defEN(R){
  var zak=function(g){if(g<6.5)return 'less than 1 sachet';var z=hlf(g/7);return z<=1?'± 1 sachet':'± '+frac(z)+' sachets (7 g)'};
  var LOC='en-GB';
  var K=function(){return state.mode==='bge'};
  var HEAD=function(){return '<div class="label">Baking</div><h2>'+(K()?'On the kamado':'In the oven')+'</h2>'};
  var CARE='<div class="tip a">Always put the stone in cold and let it heat up with the oven or BGE. A cold stone in a hot oven can crack. Never pour water on the stone.</div>';
  var STONE=function(t){return '<h4>On the pizza stone in the oven</h4><p>'+t+'</p>'};
  var BGE=function(temp,time,what,tips){return '<h4>Big Green Egg (kamado), on the pizza stone</h4><div class="oven"><div><strong>'+temp+'</strong><span>dome thermometer</span></div><div><strong>'+time+'</strong><span>minutes</span></div><div><strong>indirect</strong><span>convEGGtor</span></div></div>'+
    '<ol class="plain"><li>Put the <b>convEGGtor</b> (indirect plate) in first</li><li>Place the <b>grid</b> on top</li><li>Put the <b>pizza stone</b> on the grid and bring it up to '+temp+'C. Let the temperature settle for 20–30 minutes.</li><li>'+what+'</li></ol>'+(tips?'<div class="tip">'+tips+'</div>':'')};

  R.pizza={
    title:'Pizza<em> dough</em>', sub:'Neapolitan · oven or kamado',
    cTitle:'Number of dough balls', min:1, max:20,
    unit:function(st){return (st.count===1?'ball':'balls')+' of ±270 g'},
    toggles:[{key:'method',opts:[['snel','Quick','± 2 hours'],['lang','Slow','8-hour rise']]}],
    planQ:'When do you want to eat?',
    calc:function(st){
      var f=st.count/3, snel=st.method==='snel';
      var flour=Math.round(500*f), water=Math.round(315*f), yeast=snel?hlf(7*f):Math.max(0.5,hlf(1.5*f));
      var rows=[['Pizza flour',flour+' g','type 00 / W250'],['Water',water+' g',snel?'warm, ±38°C':'room temperature'],['Salt',Math.round(10*f)+' g',''],['Dried yeast',yeast+' g',snel?zak(yeast):'a little yeast, slow rise']];
      if(snel)rows.push(['Olive oil',Math.round(10*f)+' g','makes the dough more supple']);
      rows.push(['Semolina','for stretching','']);
      var mix='In the KitchenAid with the dough hook, stir the <b>water ('+water+' g)</b> and <b>yeast</b> for 1 minute. Add the <b>flour ('+flour+' g)</b> and knead for 3–4 minutes on a low speed. Add the <b>salt</b>'+(snel?' and <b>olive oil</b>':'')+' and knead for 2 more minutes. Stop as soon as the dough is smooth and slightly elastic.';
      var steps=[['Mix','5 min',mix,'It doesn\'t have to be perfect.']];
      if(snel){
        steps.push(['First rise','60 min','Shape it into a ball and put it in a lightly oiled bowl. Cover with a <b>damp tea towel</b> and leave it somewhere warm, 24–28°C, for example in the oven with only the light on. The dough should roughly double.','Colder than 21°C? Give the dough 75–90 minutes.']);
        steps.push(['Shape the balls','10 min + 30–45 min rest','Divide into <b>'+st.count+' '+(st.count===1?'ball':'balls')+' of ±270 g</b>. Let them rest, covered, for 30–45 minutes. The dough relaxes and stretches easily without springing back.']);
      }else{
        steps.push(['Long rise','8 hours','Put the dough in a lightly oiled bowl, cover with a <b>damp tea towel</b> and let it rise for 8 hours at room temperature (±20°C). The long rise gives more flavour and a supple dough, without oil.']);
        steps.push(['Shape the balls','1 hour before baking','Divide into <b>'+st.count+' '+(st.count===1?'ball':'balls')+' of ±270 g</b>. Let them proof, covered, for 1 hour before baking.']);
      }
      steps.push(['Stretch & bake','','Dust the worktop with <b>semolina</b> and press the ball out from the centre. Leave the rim thick for an airy crust. Top and bake straight away.','Semolina sticks less than ordinary flour, so the pizza slides off the peel easily.']);
      var bake=st.count*(K()?5:10);
      var blocks=snel?[['Make the dough',10],['First rise',60],['Shape the balls',10],['Rest the balls',40],['Bake the pizzas',bake]]:[['Make the dough',10],['Long rise',480],['Shape balls + proof',60],['Bake the pizzas',bake]];
      return {rows:rows,total:'Total dough <b>± '+Math.round(st.count*270)+' g</b>',flour:flour,steps:steps,blocks:blocks,
        marks:[K()?['Light the kamado + heat the stone',-(bake+60)]:['Preheat oven + pizza stone',-(bake+45)]]};
    },
    oven:function(st){if(K())return HEAD()+BGE('350°','± 4','Slide the pizza onto the stone with a semolina-dusted peel and close the dome. Give it a quarter turn halfway.','Bake the pizzas one at a time. After each pizza the stone needs a moment to get back up to temperature.')+CARE;
      return HEAD()+'<h4>Fan oven</h4><div class="oven"><div><strong>250°</strong><span>maximum</span></div><div><strong>8–10</strong><span>minutes</span></div><div><strong>stone</strong><span>heat with oven</span></div></div>'+
      '<div class="tip">Put your <b>pizza stone</b> on the middle shelf of the cold oven and let it heat up with the oven for at least 45 minutes at 250°C. Slide the pizza onto the stone with a semolina-dusted peel.</div>'+
      CARE;}
  };

  R.bolletjes={
    title:'White <em>Rolls</em>', sub:'Soft · fluffy · fresh from the oven',
    cTitle:'Number of rolls', min:1, max:40,
    unit:function(st){return (st.count===1?'roll':'rolls')+' of ±'+st.size+' g'},
    toggles:[{key:'size',num:true,opts:[[80,'Small','±80 g'],[125,'Regular','±125 g'],[155,'Large','±155 g · burger']]},
             {key:'liq',opts:[['room','Milk + cream','richer, softer'],['melk','Milk only','lighter']]}],
    planQ:'When do you want to eat?',
    calc:function(st){
      var f=st.count*st.size/1250, room=st.liq==='room';
      var milk=room?r5(200*f):r5(400*f), cream=room?r5(200*f):0;
      var f1=Math.round(300*f), f2=Math.round(350*f), yeast=hlf(8*f), salt=Math.round(12*f);
      var egg=Math.max(0.5,hlf(f)), yolk=Math.max(1,Math.round(f));
      var per=st.size===80?16:st.size===125?12:9, trays=Math.ceil(st.count/per);
      var rows=[['grp','Starter dough'],['Milk',milk+' ml','lukewarm']];
      if(cream)rows.push(['Whipping cream',cream+' ml','lukewarm, with the milk']);
      rows=rows.concat([['Flour',f1+' g','first part'],['Butter',Math.round(60*f)+' g','soft'],['Sugar',Math.round(60*f)+' g','less is fine, at least '+Math.max(5,Math.round(10*f))+' g'],['Dried yeast',yeast+' g',zak(yeast)],
        ['grp','Main dough'],['Egg',frac(egg)+' egg','≈ '+Math.round(50*f)+' g, beaten'],['Salt',salt+' g',''],['Flour',f2+' g','second part'],
        ['grp','Glaze'],['Egg yolk',yolk+'×',''],['Greek yoghurt',yolk+' tbsp','or a little cream'],['Sesame / poppy seeds','to taste','optional']]);
      var liquid=cream?milk+' ml milk and '+cream+' ml cream':milk+' ml milk';
      var steps=[
        ['Starter dough','30 min','Warm <b>'+liquid+'</b> until lukewarm. If you dip a finger in and want to say "ouch", it\'s too hot and will kill the yeast. Mix in a bowl with <b>'+f1+' g flour</b>, the butter, sugar and yeast. Mix briefly, then cover with a tea towel for 30 minutes.','After half an hour the starter dough will have grown a lot. That tells you straight away that your yeast is alive.'],
        ['Knead','10 min','Add <b>'+frac(egg)+' egg</b>, <b>'+salt+' g salt</b> and <b>'+f2+' g flour</b>. Knead for ±10 minutes by hand, or ±8 minutes with the dough hook on a low speed. The dough may be a little sticky. If it\'s very sticky, it hasn\'t been kneaded long enough.','Kneading long enough is the secret of a fluffy roll.'],
        ['First rise','1–2 hours','Cover the bowl and let the dough double. The warmer the kitchen, the faster it goes.'],
        ['Shape','15 min','Knock the air out and divide the dough into <b>'+st.count+' pieces of ±'+st.size+' g</b>. Cup your hand over a piece and roll it around on the worktop to build tension in the dough. Place them on '+(trays>1?trays+' baking trays':'a baking tray')+' lined with baking paper.','Weigh the pieces so they are all the same size and bake evenly.'],
        ['Second rise','± 45 min','Cover again and let them double. Tip: in the oven with only the light on.'],
        ['Glaze & bake',K()?'15–18 min':'12–15 min','Beat <b>'+yolk+' egg yolk'+(yolk>1?'s':'')+'</b> with <b>'+yolk+' tbsp Greek yoghurt</b> and brush the rolls. Sprinkle with sesame or poppy seeds if you like. '+(K()?'Slide them on baking paper onto the pizza stone in the kamado and bake for 15–18 minutes at <b>190°C</b>.':'Bake for 12–15 minutes at <b>180°C</b>.')]];
      return {rows:rows,total:'Total dough <b>± '+(st.count*st.size).toLocaleString(LOC)+' g</b></span><span>Baking trays <b>'+trays+' × (±'+per+' per tray)</b>',flour:f1+f2,steps:steps,
        blocks:[['Make the starter dough',35],['Knead',15],['First rise',90],['Shape',15],[K()?'Second rise':'Second rise + preheat oven',45],['Bake'+(trays>1?' ('+trays+' rounds)':''),(K()?18:15)*trays+5]],marks:K()?[['Light the kamado + heat the stone',-((18*trays+5)+60)]]:[]};
    },
    oven:function(){if(K())return HEAD()+BGE('190°','15–18','Slide the rolls on baking paper onto the stone and close the dome. Check the bottoms after 10 minutes.','Fewer rolls fit on the round stone than on a baking tray. Plan an extra round and keep the rest cool in the meantime.')+CARE;
      return HEAD()+'<h4>On a baking tray</h4><div class="oven"><div><strong>180°</strong><span>top/bottom heat</span></div><div><strong>12–15</strong><span>minutes</span></div><div><strong>middle</strong><span>shelf</span></div></div>'+
      '<div class="tip a">Proofing them in the oven with only the light on? Take them out first before you preheat.</div>'+
      '<div class="tip">Fan oven: set it to ±170°C. They\'re done when golden brown and they sound hollow when you tap the bottom. Check after 12 minutes the first time.</div>'+
      '<div class="tip">Several trays? Bake them one at a time and keep the next tray somewhere cool so they don\'t over-proof.</div>'+
      STONE('Heat the stone with the oven for 45 minutes at 180°C. Proof the rolls on baking paper and slide them, paper and all, onto the stone with a board or your pizza peel. They get more heat from below, so check after 10 minutes that the bottoms aren\'t getting too dark.')+CARE;}
  };

  R.zuurdesem={
    title:'Sourdough <em>Bread</em>', sub:'Starter · banneton · cast-iron pot',
    cTitle:'Number of loaves', min:1, max:4,
    unit:function(st){return (st.count===1?'loaf':'loaves')+' of ±930 g dough'},
    toggles:[{key:'method',opts:[['koel','Fridge','12 h · bake tomorrow'],['dag','Same day','3 h rise']]}],
    planQ:'When do you want to slice the bread?',
    calc:function(st){
      var n=st.count, koel=st.method==='koel';
      var rows=[['Wheat flour',(500*n)+' g','preferably organic'],['Water',(300*n)+' ml','lukewarm'],['Sourdough starter',(125*n)+' g','active, bubbly'],['Salt',(8*n)+' g',''],['Oil','a little','to grease the bowl']];
      var steps=[
        ['Feed the starter','4–12 hours ahead','You need <b>'+(125*n)+' g active starter</b>. Feed it in time with equal parts flour and water, so it\'s full of bubbles when you mix.','Quick test: a spoonful of starter in a glass of water floats when it\'s ready.'],
        ['Mix','5 min + 30 min rest','Mix the <b>lukewarm water ('+(300*n)+' ml)</b> with the <b>flour</b>, <b>starter</b> and <b>salt</b>. Knead for 5 minutes with the dough hooks on the middle speed until supple. Cover with a damp tea towel and leave for 30 minutes.'],
        ['Fold','5 min','Wet your hands. Gently stretch a piece of dough at the edge and fold it inwards. Work your way around until the whole edge is folded in. Put the dough in a lightly oiled bowl and cover with a damp tea towel.'],
        koel?['Rise & cold rise','2 h + 12 h','First let the dough rise on the counter for 2 hours, until it is visibly airier and has grown by ±50%. Then put the bowl in the fridge for 12 hours. The cold rise gives a fuller, tangier flavour, and the dough is easier to shape afterwards.','If the dough goes straight into the fridge, it doesn\'t get enough time to rise and the loaf turns out dense.']
            :['Rise','3 hours','Let the dough rise for 3 hours somewhere warm. The warmer the kitchen, the faster it goes.','At 24–26°C 3 hours is enough, at 20°C it takes more like 4–5 hours. Watch the dough, not the clock: it should have grown by ±50%, with bubbles on the sides.'],
        ['Shape & banneton','1.5 hours','Turn the dough onto a lightly floured worktop'+(n>1?' and divide it into <b>'+n+' equal pieces</b>':'')+'. Shape a ball by tucking the bottom inwards with turning movements. Place it seam side up in a floured banneton and pinch the seam closed. Let it rise for 1.5 hours somewhere warm.','No banneton? A clean, floured tea towel in a colander or bowl works too. The dough is ready when it springs back slowly after a gentle poke.'],
        ['Bake','40–45 min',(K()?'Heat the kamado to <b>230°C</b> with the <b>cast-iron pot and lid</b> on the pizza stone.':'Preheat the oven to <b>240°C</b> with the <b>cast-iron pot and lid</b> inside.')+' Turn the dough out onto baking paper, smooth side up, and make one cut across the middle with a sharp blade. Lift it on the paper into the hot pot. Bake <b>25 minutes with the lid on</b>, then <b>15–20 minutes without</b>, until golden brown.','Let the bread cool completely before slicing. It keeps baking on the inside.']];
      var bake=45*n;
      var blocks=[['Mix + rest',35],['Fold',10]].concat(koel?[['Rise on the counter',120],['Cold rise (fridge)',720]]:[['Rise',180]],[['Shape',10],['Rise in banneton',90],['Bake'+(n>1?' ('+n+' loaves in turn)':''),bake],['Cool',60]]);
      return {rows:rows,total:'Total dough <b>± '+(933*n).toLocaleString(LOC)+' g</b></span><span>Hydration <b>± 64%</b>',flour:500*n,steps:steps,blocks:blocks,
        marks:[['Feed the starter',-99999],K()?['Light the kamado, pot on the stone',-(bake+60+60)]:['Preheat oven + pot',-(bake+60+45)]]};
    },
    oven:function(st){if(K())return HEAD()+BGE('230°','40–45','Put the cast-iron pot on the stone and let it heat up for 30 minutes. Bake 25 minutes with the pot lid on and 15–20 minutes without, keeping the BGE dome closed.','It also works without a pot: put the bread on baking paper straight on the stone. The closed BGE holds plenty of moisture by itself.')+CARE;
      return HEAD()+'<h4>In the cast-iron pot</h4><div class="oven"><div><strong>240°</strong><span>preheated</span></div><div><strong>25</strong><span>min lid on</span></div><div><strong>15–20</strong><span>min lid off</span></div></div>'+
      '<div class="tip a">The lid traps the steam. That lets the bread rise well before the crust sets.</div>'+
      '<div class="tip">Done when it sounds hollow when you tap the bottom.'+(st.count>1?' One pot? Bake the loaves in turn and keep the next one waiting in its banneton in the fridge.':'')+'</div>'+
      STONE('No cast-iron pot? Bake straight on the stone. Heat the stone with the oven for 45 minutes at 240°C, with a metal tray at the bottom of the oven. Put the bread on baking paper on the stone, pour half a cup of hot water into the tray and bake for 20 minutes. Remove the tray and bake for another 20–25 minutes.')+CARE;},
    extra:function(){return '<div class="label">No starter yet?</div><h2>Make your own starter</h2>'+
      '<p>This takes about a week. You need wholemeal flour and lukewarm water.</p>'+
      '<ol class="plain"><li><b>Day 1:</b> weigh a clean jar and note the weight. Mix 50 g wholemeal flour with 50 ml lukewarm water into a smooth paste. Cover loosely and keep somewhere warm, out of draughts and sunlight.</li>'+
      '<li><b>Days 2 to 7:</b> stir in 50 g wholemeal flour and 50 ml lukewarm water every day.</li>'+
      '<li><b>Ready:</b> after ±7 days it\'s full of bubbles and smells slightly sour. A grey layer of liquid on top is normal; stir it in.</li></ol>'+
      '<div class="tip">Not baking every week? Keep the starter covered in the fridge and feed it every 7 to 14 days. Never fill the jar more than three-quarters, because it rises.</div>';}
  };

  R.stokbrood={
    title:'French <em>Baguette</em>', sub:'Crisp crust · open crumb · steam',
    cTitle:'Number of baguettes', min:1, max:12,
    unit:function(st){return (st.count===1?'baguette':'baguettes')+' of ±'+(st.method==='zd'?300:320)+' g · ±30 cm for your pizza stone'},
    toggles:[{key:'method',opts:[['gist','With yeast','1 day · 85% hydration'],['zd','Sourdough','2 days · 74% hydration']]}],
    planQ:'When do you want to eat?',
    calc:function(st){
      var n=st.count, f=n/3, zd=st.method==='zd', r1=function(x){return Math.round(x)};
      var per=2, batches=Math.ceil(n/per), bake=20*batches;
      var rows, steps, blocks, marks, total;
      var bakeStep=K()
        ?['Score & bake','± 20 min'+(batches>1?' per round':''),'Put the baguettes seam side down on baking paper on your peel. Score each one with a single quick, confident cut at <b>45°</b> along its length. Mist them with the spray bottle, slide them onto the pizza stone and close the dome. Bake for <b>± 20 minutes at 240–250°C</b>.'+(batches>1?' Bake in <b>'+batches+' rounds</b> of '+per+'.':''),'Check after 16 minutes. On the stone the bottoms bake faster.']
        :['Score & bake','20 min'+(batches>1?' per round':''),'Put the baguettes seam side down on baking paper on your peel. Score each one with a single quick, confident cut at <b>45°</b> along its length. Slide them onto the stone and immediately pour <b>¾ cup boiling water</b> into the hot pan. Bake for <b>10 minutes at 250°C</b> with steam. Open the door briefly to let the steam out, turn the oven down to <b>230°C</b> and bake for another ±10 minutes until nicely browned.'+(batches>1?' Bake in <b>'+batches+' rounds</b> of '+per+'.':''),'Is the dough soft? Chill the baguettes for 15 minutes first, so they\'re easier to score.'];
      var shape=['Shape & proof',zd?'1 hour':'45 min','Turn a piece bottom side up and press it flat into a long rectangle. Fold the top ⅔ down and press firmly, turn 180° and repeat. Press the middle in with your thumb, fold it in half and seal the seam with the side of your hand. Roll from the centre outwards to <b>±30 cm</b> with tapered ends, using as little flour as possible. Lay them seam side down in the dusted cloth, with pleats for support, and let them proof for '+(zd?'1 hour':'±45 minutes')+'.','Poke test: press gently into the dough with a finger. If a slight dent remains and slowly springs back, it\'s ready.'];
      if(!zd){
        var fl=r1(515*f), w1=r1(350*f), w2=r1(10*f), w3=r1(80*f), salt=r1(10*f), y=Math.round(3*f*10)/10;
        rows=[['grp','Dough'],['Bread flour',fl+' g','high-protein flour, e.g. Manitoba'],['Water',(w1+w2+w3)+' g','split: '+w1+' + '+w2+' + '+w3+' g'],['Salt',salt+' g',''],['Instant dried yeast',y+' g',''],
          ['grp','You need'],['Flour + rice flour','50/50, for the cloth',''],K()?['Spray bottle','with water','']:['Cast-iron pan','or lava rocks, for steam','']];
        steps=[
          ['Autolyse','1 hour','Mix <b>'+fl+' g flour</b> with <b>'+w1+' g water</b> until no dry flour is left. Cover and rest for 1 hour.','Warm kitchen? Put the bowl in the fridge.'],
          ['Mix & knead','± 10 min','Add <b>'+salt+' g salt</b>, <b>'+y+' g yeast</b> and <b>'+w2+' g water</b> and mix with the dough hook on a low speed. Turn the KitchenAid up and add the last <b>'+w3+' g water</b> a splash at a time. Wait each time until it\'s absorbed. Keep kneading until the dough is smooth and strong.','Windowpane test: stretch a small piece of dough. If you can see light through it without it tearing, it\'s good.'],
          ['Rise & fold','1 hour','Put the dough in a lightly oiled bowl and let it rise for 30 minutes. Stretch and fold it once all round, turn it folded side down and rest for another 30 minutes.','The dough is very sticky, that\'s normal at 85% hydration. Don\'t add extra flour, work with a scraper.'],
          ['Divide & pre-shape','20 min rest','Dust the cloth with the flour and rice flour. Turn the dough onto the worktop, press it evenly flat and divide it into <b>'+n+' '+(n===1?'piece':'equal pieces')+'</b>. Fold the top ⅔ down and the bottom ⅔ up, fold it closed and seal the seam. Rest, covered, for 20 minutes.'],
          shape, bakeStep];
        blocks=[['Autolyse',60],['Mix & knead',15],['Rise & fold',60],['Divide & pre-shape',25],['Shape & proof',50],['Bake'+(batches>1?' ('+batches+' rounds)':''),bake],['Cool on a rack',25]];
        total='Total dough <b>± '+r1(968*f).toLocaleString(LOC)+' g</b></span><span>Hydration <b>85%</b>';
      }else{
        var fl2=r1(450*f), wa=r1(270*f), wb=r1(45*f), salt2=r1(9*f), lev=r1(135*f), feed=r1(55*f);
        rows=[['grp','Levain · 4–5 hours ahead'],['Starter',feed+' g','active'],['Flour',feed+' g',''],['Water',feed+' g',''],
          ['grp','Dough'],['Bread flour or T65',fl2+' g',''],['Water',(wa+wb)+' g','cold, split: '+wa+' + '+wb+' g'],['Active levain',lev+' g','at its peak'],['Salt',salt2+' g',''],
          ['grp','You need'],['Flour + rice flour','50/50, for the cloth',''],K()?['Spray bottle','with water','']:['Cast-iron pan','or lava rocks, for steam','']];
        steps=[
          ['Levain','4–5 hours','Feed your starter 1:1:1: <b>'+feed+' g starter, '+feed+' g flour and '+feed+' g water</b>. Let it peak at room temperature: domed, full of bubbles and smelling slightly sour.','Time it so the levain peaks about 1 hour after you make the autolyse.'],
          ['Autolyse','1 hour','Mix <b>'+fl2+' g flour</b> with <b>'+wa+' g cold water</b> until no dry flour is left. Cover and rest for 1 hour.'],
          ['Mix & knead','± 10 min','Add <b>'+lev+' g levain</b> and <b>'+salt2+' g salt</b>. Knead for 5 minutes on a low speed and 2 minutes on the middle speed. Add the last <b>'+wb+' g water</b> over ±2 minutes. Keep kneading until the dough is smooth and passes the windowpane test.','Aim for a dough temperature of ±24°C. Then the rising times below will be right.'],
          ['Bulk rise','3–3.5 hours','Put the dough in a lightly oiled rectangular container, smooth side up. Stretch and fold it once after 1.5 hours. It\'s ready when it has risen by ±20%, with bubbles on the sides and top. It doesn\'t need to double.'],
          ['Cold rise','15–17 hours','Put the container in the fridge, covered. The long cold rise gives the deep flavour.'],
          ['Divide & pre-shape','30 + 30 min','Leave the dough on the counter for 30 minutes. Dust the cloth with the flour and rice flour. Turn the dough out, press it gently flat and divide it into <b>'+n+' '+(n===1?'piece':'equal pieces')+'</b>. Fold them like a letter and seal the seam. Rest, covered, for 30 minutes.'],
          shape, bakeStep];
        blocks=[['Feed the levain',210],['Autolyse',60],['Mix & knead',15],['Bulk rise',195],['Cold rise (fridge)',960],['On the counter',30],['Divide & pre-shape',40],['Shape & proof',70],['Bake'+(batches>1?' ('+batches+' rounds)':''),bake],['Cool on a rack',25]];
        total='Total dough <b>± '+r1(909*f).toLocaleString(LOC)+' g</b></span><span>Hydration <b>74%</b>';
      }
      marks=[K()?['Light the kamado + heat the stone',-(25+bake+60)]:['Preheat oven + stone + pan to 260°C',-(25+bake+60)]];
      return {rows:rows,total:total+'</span><span>Rounds <b>'+batches+' × (max '+per+')</b>',flour:zd?r1(450*f):r1(515*f),steps:steps,blocks:blocks,marks:marks};
    },
    oven:function(st){if(K())return HEAD()+BGE('250°','± 20','Make the baguettes ±30 cm so they fit on the stone, and bake 2 at a time. Slide them on baking paper onto the stone and close the dome. Check after 16 minutes.','No steam tray needed, because the closed BGE holds moisture. Mist the baguettes with a spray bottle just before baking so the cuts open up better.')+CARE;
      var b=Math.ceil(st.count/2);return HEAD()+'<h4>On the stone, with steam</h4><div class="oven"><div><strong>250°</strong><span>10 min steam</span></div><div><strong>230°</strong><span>±10 min more</span></div><div><strong>¾ cup</strong><span>boiling water</span></div></div>'+
      '<div class="tip a">Preheat the oven to <b>260°C</b>, with the pizza stone on the middle shelf and a cast-iron pan or tray of lava rocks at the bottom. The longer you preheat, the crispier the crust. A round stone fits 2 baguettes of ±30 cm side by side.</div>'+
      '<div class="tip">Fan oven? Switch it off just before you load the baguettes, otherwise the fan sets the crust too early. Pour in the water and bake for 8 minutes with the oven off. Open the door briefly, switch the oven back on at 250°C and bake for another ±10 minutes.</div>'+
      (b>1?'<div class="tip">'+b+' rounds: keep the next baguettes in the fridge meanwhile, so they don\'t over-proof.</div>':'')+CARE;},
    extra:function(){return '<div class="label">Tips &amp; tricks</div><h2>When it doesn\'t work</h2>'+
      '<ol class="plain"><li><b>Crumb too tight:</b> under-proofed or not kneaded enough. Do the windowpane test and don\'t skip the folds.</li>'+
      '<li><b>Uneven crumb:</b> usually the shaping. Press evenly all over and taper both ends the same.</li>'+
      '<li><b>Crust not crisp:</b> not enough steam or the oven isn\'t hot enough. Preheat longer and make sure there\'s real steam in the first minutes.</li>'+
      '<li><b>Dough tears when shaping:</b> too cold or too tight. Let it rest a few minutes longer.</li></ol>'+
      '<div class="tip">A pleated linen cloth keeps the baguettes in shape. Dust it with half flour, half rice flour: rice flour doesn\'t stick.</div>'+
      '<div class="tip a"><b>Storing:</b> best on the day itself, the crust softens overnight. Freeze cooled baguettes for up to 1 month in an airtight bag. To reheat: straight from frozen, 10–12 minutes at 180°C.</div>';}
  };

  R.koekjes={
    title:'Fondant<em> Cookies</em>', sub:'No-spread dough · fondant · personalised',
    cTitle:'Number of cookies', min:1, max:150,
    unit:function(st){return (st.count===1?'cookie':'cookies')+' of Ø 7 cm, scalloped'},
    toggles:[{key:'kleur',opts:[['roze','Pink','powder pink'],['ivoor','Ivory','warm white'],['blauw','Blue','light blue'],['geel','Yellow','soft yellow']]},
             {key:'tekst',opts:[['ja','With text','letter stamps'],['nee','No text','fondant only']]}],
    planQ:'When do they need to be ready?',
    calc:function(st){
      var n=st.count, f=n/20, txt=st.tekst==='ja';
      var KL={roze:'a touch of pink gel colour',ivoor:'a tiny amount of yellow or brown gel colour',blauw:'a touch of blue gel colour',geel:'a touch of yellow gel colour'};
      var fond=Math.ceil(n*15*1.25/10)*10, trays=Math.ceil(n/20), flour=Math.round(200*f);
      var rows=[['grp','Cookie dough'],['Butter',Math.round(150*f)+' g','unsalted, at room temperature'],['Caster sugar',Math.round(100*f)+' g',''],['Egg yolk',Math.max(1,Math.round(f))+'×',''],['Plain flour',flour+' g','plus extra for rolling'],
        ['grp','Finishing'],['Fondant',fond+' g','white, including scraps'],['Gel colour',st.kleur==='ivoor'?'very little':'a touch',{roze:'pink',ivoor:'yellow or brown',blauw:'blue',geel:'yellow'}[st.kleur]],['Edible glue','a little','or water or apricot jam, to stick'],['Cornflour or icing sugar','a little','for rolling']];
      if(txt)rows.push(['Letter stamps','1 set','for the text']);
      rows.push(['Scalloped cutter','Ø 7 cm','for cookie and fondant']);
      var steps=[
        ['Make the dough','10 min','Knead <b>'+Math.round(150*f)+' g soft butter</b>, <b>'+Math.round(100*f)+' g sugar</b>, <b>'+Math.max(1,Math.round(f))+' egg yolk'+(Math.round(f)>1?'s':'')+'</b> and <b>'+flour+' g flour</b> into a smooth dough. Don\'t knead longer than needed.','There\'s deliberately no baking powder. The cookies don\'t rise and stay nice and flat, so the fondant sits neatly on top.'],
        ['Rest','1 hour','Press the dough into a flat disc, wrap it in cling film and chill for 1 hour.'],
        ['Roll & cut','20 min','Preheat the oven to <b>175°C</b>. Roll the dough out between two sheets of baking paper to <b>5 mm</b> thick. Cut out <b>'+n+' '+(n===1?'cookie':'cookies')+'</b> with the scalloped cutter and place them on baking paper on '+(trays>1?trays+' baking trays':'a baking tray')+'. Knead the scraps together and roll out again.','Chill the cut cookies for 10 minutes before they go in the oven. That keeps the scallops sharp.'],
        ['Bake','12–15 min'+(trays>1?' per tray':''),'Bake until the edges just turn light golden. Then let them <b>cool completely</b> on a rack, at least 45 minutes.','Fondant on a warm cookie melts and turns sticky. Really wait until they\'re cold.'],
        ['Colour & roll the fondant','15 min','Knead the <b>'+fond+' g fondant</b> until supple. Add <b>'+KL[st.kleur]+'</b> with a toothpick and knead until the colour is even. Roll the fondant out on a little cornflour to <b>3 mm</b> and cut circles with the same cutter.','Go lighter rather than darker: fondant deepens a little after an hour. Keep the fondant you\'re not using covered so it doesn\'t dry out.']];
      if(txt)steps.push(['Stamp the text','± 1 min per cookie','Press the text into the <b>fresh, soft fondant</b> with the letter stamps, right after cutting. Press straight and evenly, not too deep.','Keep it short: ±14 characters on the first line and ±22 on the second fits nicely on a 7 cm cookie.']);
      steps.push(['Stick & dry','1–2 hours','Brush each cookie thinly with edible glue, a little water or apricot jam. Lay the fondant on top and press gently with a flat hand. Let the cookies dry for 1–2 hours before packing.','Store airtight, cool and dry, for up to ±2 weeks. Not in the fridge: the fondant will sweat.']);
      var bake=15*trays+5;
      var blocks=[['Make the dough',10],['Rest the dough (fridge)',60],['Roll & cut',20],['Bake'+(trays>1?' ('+trays+' trays)':''),bake],['Cool',45],['Colour & roll the fondant',15+Math.round(n*0.5)]];
      if(txt)blocks.push(['Stamp the text',Math.round(n*1)]);
      blocks.push(['Stick',Math.round(n*0.5)+5],['Let dry',90]);
      var after=blocks.slice(3).reduce(function(a,b){return a+b[1]},0);
      return {rows:rows,total:'Cookie dough <b>± '+Math.round(450*f).toLocaleString(LOC)+' g</b></span><span>Fondant <b>± '+fond.toLocaleString(LOC)+' g</b>',flour:flour,steps:steps,blocks:blocks,
        marks:[K()?['Light the kamado',-(after+45)]:['Preheat the oven to 175°C',-(after+20)]]};
    },
    oven:function(){if(K())return HEAD()+BGE('170°','12–15','Put the cookies on baking paper on a baking tray, set it on the stone and close the dome. Check after 10 minutes.','Keep the kamado low, at 160–175°C, with the vents almost closed. It creeps up easily, and cookies burn fast.')+CARE;
      return HEAD()+'<h4>On a baking tray</h4><div class="oven"><div><strong>175°</strong><span>top/bottom heat</span></div><div><strong>12–15</strong><span>minutes</span></div><div><strong>middle</strong><span>shelf</span></div></div>'+
      '<div class="tip a">Bake until the edges just start to colour. Pale in the middle is fine: that keeps them buttery and nice and light under the fondant.</div>'+
      '<div class="tip">Fan oven: set it to ±160°C. Bake one tray at a time and keep the next one in the fridge meanwhile.</div>'+
      STONE('Put the cookies on baking paper on the stone. They get more heat from below, so check after 10 minutes that the bottoms aren\'t getting too dark.')+CARE;},
    extra:function(){return '<div class="label">Tips &amp; tricks</div><h2>A clean finish</h2>'+
      '<ol class="plain"><li><b>Air bubble in the fondant?</b> Prick it with a needle and smooth it over.</li>'+
      '<li><b>Fondant sticking?</b> Use a little more cornflour, or cool your hands for a moment. Warm hands soften fondant.</li>'+
      '<li><b>Cookies spreading?</b> The dough was too warm. Rest it longer and chill the cut cookies before baking.</li>'+
      '<li><b>Fondant doesn\'t fit exactly?</b> Cut fondant and cookie with the same cutter. The fondant doesn\'t shrink, the cookie shrinks slightly.</li></ol>'+
      '<div class="tip">Feel free to bake the cookies a day ahead. Baked cookies without fondant keep well for a week in an airtight tin.</div>';}
  };

    el.innerHTML='<img src="img/'+tab+'.webp" alt="'+L().alt[tab]+'" width="1400" height="782" decoding="async">';
  }
  ['pizza','bolletjes','zuurdesem','stokbrood','koekjes'].forEach(function(t){var i=new Image();i.src='img/'+t+'.webp'});

  /* ---------- Render ---------- */
  function render(){
    var tab=state.tab, rc=R[tab], st=state[tab], out=rc.calc(st);
    document.body.dataset.tab=tab;
    document.querySelectorAll('.tabs a').forEach(function(a){if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
    art(tab); applyUI();
    $('switch').dataset.mode=state.mode;
    $('m-oven').setAttribute('aria-pressed',state.mode==='oven'); $('m-bge').setAttribute('aria-pressed',state.mode==='bge');
    $('heroTitle').innerHTML=rc.title; $('heroSub').textContent=rc.sub;
    $('cTitle').textContent=rc.cTitle; $('count').textContent=st.count; $('countSub').textContent=rc.unit(st);
    $('toggles').innerHTML=rc.toggles.map(function(t){return '<div class="seg" role="group">'+t.opts.map(function(o){
      return '<button type="button" id="t-'+tab+'-'+t.key+'-'+o[0]+'" data-key="'+t.key+'" data-val="'+o[0]+'" data-num="'+(t.num?1:0)+'" aria-pressed="'+(st[t.key]==o[0])+'">'+o[1]+'<small>'+o[2]+'</small></button>'}).join('')+'</div>'}).join('');
    var w=$('warn'); if(out.flour>FLOUR_MAX){w.hidden=false;w.textContent=L().warn(out.flour.toLocaleString(L().loc))}else w.hidden=true;
    $('ing').innerHTML=out.rows.map(function(r){if(r[0]==='grp')return '<li class="grp">'+r[1]+'</li>';
      return '<li><span>'+r[0]+(r[2]?'<span class="note">'+r[2]+'</span>':'')+'</span><span class="amt">'+r[1]+'</span></li>'}).join('');
    $('total').innerHTML='<span>'+out.total+'</span>';
    $('steps').innerHTML=out.steps.map(function(s,i){return '<div class="step"><div class="num">'+(i+1)+'</div><div><h3>'+s[0]+(s[1]?'<span>'+s[1]+'</span>':'')+'</h3><p>'+s[2]+'</p>'+(s[3]?'<div class="tip">'+s[3]+'</div>':'')+'</div></div>'}).join('');
    $('ovenCard').innerHTML=rc.oven(st);
    var ex=$('extraCard'); if(rc.extra){ex.hidden=false;ex.innerHTML=rc.extra()}else{ex.hidden=true;ex.innerHTML=''}
    $('planQ').textContent=rc.planQ; $('eat').value=st.eat;
    plan(out); save();
  }

  function plan(out){
    var p=(state[state.tab].eat||'18:00').split(':'), eat=(+p[0])*60+(+p[1]);
    var total=out.blocks.reduce(function(a,b){return a+b[1]},0), t=eat-total, items=[];
    out.blocks.forEach(function(b){items.push({m:t,txt:b[0]});t+=b[1]});
    var start=eat-total;
    out.marks.forEach(function(mk){var m=mk[1]===-99999?start-360:eat+mk[1];items.push({m:m,txt:mk[0],mk:true})});
    items.sort(function(a,b){return a.m-b.m});
    items.push({m:eat,txt:state.tab==='zuurdesem'?L().slice:state.tab==='koekjes'?L().ready:L().eat,go:true});
    var fmt=function(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
    var dayName=function(d){return d===0?L().day0:d===-1?L().day1:L().dayN(-d)};
    var dayOf=function(m){return Math.floor(m/1440)};
    var multi=dayOf(items[0].m)!==dayOf(eat), last=null, html='';
    items.forEach(function(it){var d=dayOf(it.m);if(multi&&d!==last){html+='<li class="day">'+dayName(d)+'</li>';last=d}
      html+='<li class="'+(it.mk?'mk':'')+(it.go?' go':'')+'"><time>'+fmt(it.m)+'</time><span>'+it.txt+'</span></li>'});
    $('tl').innerHTML=html;
    var first=items[0].m, dur=eat-first;
    $('startAt').textContent=L().start(dayOf(first)<dayOf(eat)?dayName(dayOf(first)).toLowerCase()+' ':'',fmt(first),Math.floor(dur/60),dur%60);
  }

  /* ---------- Events ---------- */
  $('min').onclick=function(){var st=state[state.tab];if(st.count>R[state.tab].min){st.count--;render()}};
  $('plus').onclick=function(){var st=state[state.tab];if(st.count<R[state.tab].max){st.count++;render()}};
  $('toggles').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state[state.tab][b.dataset.key]=b.dataset.num==='1'?+b.dataset.val:b.dataset.val;render()});
  $('lang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.dataset.lang===state.lang)return;state.lang=b.dataset.lang;setLang(state.lang);render()});
  $('switch').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.dataset.mode===state.mode)return;state.mode=b.dataset.mode;render()});
  $('eat').addEventListener('input',function(){state[state.tab].eat=this.value||'18:00';plan(R[state.tab].calc(state[state.tab]));save()});
  function fromHash(){var h=location.hash.replace('#','');if(R[h]){state.tab=h}render()}
  window.addEventListener('hashchange',fromHash);
  if(!R[location.hash.replace('#','')]){try{var s=JSON.parse(localStorage.getItem('bakboek')||'null');if(s&&R[s.tab])state.tab=s.tab}catch(e){}}
  fromHash();
})();
</script>

</body>
</html>
